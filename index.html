  navButtons(main, { back:true, next: !!state.mesh, onNext:()=>{ state.step=5; renderAll(); } });
}

/* --- Step 4: Initial Conditions (transient only) + Boundary Conditions (mesh-independent — runs before meshing) --- */
function renderBcStep(main){
  ensureBcDefaults();
  const titleText = state.analysisType==='transient' ? 'กำหนดเงื่อนไขเริ่มต้นและเงื่อนไขขอบเขต' : 'กำหนดเงื่อนไขขอบเขต (Boundary Conditions)';
  makeTitle(main, titleText, 'เลือกประเภทเงื่อนไขของแต่ละขอบ: Insulated (ไม่มีการถ่ายเทความร้อนผ่านขอบ), Fixed temperature (กำหนดอุณหภูมิคงที่), หรือ Heat flux (กำหนดฟลักซ์ความร้อน)');

  if(state.analysisType==='transient'){
    const icBox = document.createElement('div'); icBox.className='eq-block';
    const icCap = document.createElement('div'); icCap.className='eq-caption'; icCap.textContent='เงื่อนไขเริ่มต้น (Initial Conditions)';
    icBox.appendChild(icCap);

    const icRow = document.createElement('div'); icRow.className='field-row';
    const t0f = document.createElement('div'); t0f.className='field';
    t0f.innerHTML = `<label>อุณหภูมิเริ่มต้น T₀ (สม่ำเสมอทั้งโมเดล)</label>`;
    const t0i = document.createElement('input'); t0i.type='number'; t0i.step='any'; t0i.value=state.transient.T0;
    t0i.addEventListener('input', ()=>{ const v=parseFloat(t0i.value); if(!isNaN(v)) state.transient.T0=v; });
    const t0u = document.createElement('span'); t0u.className='unit'; t0u.textContent='°C';
    t0f.appendChild(t0i); t0f.appendChild(t0u);
    icRow.appendChild(t0f);

    const ttf = document.createElement('div'); ttf.className='field';
    ttf.innerHTML = `<label>เวลาสิ้นสุดการจำลอง</label>`;
    const tti = document.createElement('input'); tti.type='number'; tti.step='any'; tti.min='0.0001'; tti.value=state.transient.totalTime;
    tti.addEventListener('input', ()=>{ const v=parseFloat(tti.value); if(!isNaN(v) && v>0) state.transient.totalTime=v; });
    const ttu = document.createElement('span'); ttu.className='unit'; ttu.textContent='s';
    ttf.appendChild(tti); ttf.appendChild(ttu);
    icRow.appendChild(ttf);

    const sf = document.createElement('div'); sf.className='field';
    sf.innerHTML = `<label>จำนวน time step (ไม่เกิน 300)</label>`;
    const si = document.createElement('input'); si.type='number'; si.min='1'; si.max='300'; si.step='1'; si.value=state.transient.steps;
    si.addEventListener('input', ()=>{ const v=parseInt(si.value); if(!isNaN(v)) state.transient.steps=Math.max(1,Math.min(300,v)); });
    const su = document.createElement('span'); su.className='unit'; su.textContent='steps';
    sf.appendChild(si); sf.appendChild(su);
    icRow.appendChild(sf);
    icBox.appendChild(icRow);

    const setBtn = document.createElement('button'); setBtn.className='secondary'; setBtn.textContent='Set';
    setBtn.style.marginTop='4px';
    const icApplied = document.createElement('div'); icApplied.className='eq-applied'; icApplied.style.display='block'; icApplied.style.marginTop='10px';
    function refreshIcApplied(){
      const dt = state.transient.totalTime/Math.max(1,state.transient.steps);
      icApplied.textContent = `ยืนยันแล้ว: T₀ = ${state.transient.T0} °C, เวลาสิ้นสุด = ${state.transient.totalTime} s, จำนวน step = ${state.transient.steps} (Δt = ${dt.toFixed(4)} s ต่อ step)`;
    }
    setBtn.onclick = refreshIcApplied;
    icBox.appendChild(setBtn);
    refreshIcApplied();
    icBox.appendChild(icApplied);

    const icNote = document.createElement('div'); icNote.className='eq-note'; icNote.style.marginTop='8px';
    icNote.textContent = 'อุณหภูมิเริ่มต้นใช้ค่าสม่ำเสมอทั้งโมเดล ยกเว้นขอบที่กำหนด Fixed temperature ด้านล่าง ซึ่งจะเริ่มที่ค่านั้นทันที ณ t=0 — พิมพ์ค่าแล้วกด Set เพื่อยืนยัน';
    icBox.appendChild(icNote);

    main.appendChild(icBox);
  }

  const eqList = document.createElement('div'); eqList.className='eq-block';
  const capEl = document.createElement('div'); capEl.className='eq-caption'; capEl.textContent='นิยามทางคณิตศาสตร์ของเงื่อนไขขอบเขตแต่ละแบบ';
  eqList.appendChild(capEl);
  const rowsEq = [
    ['Fixed temperature (Dirichlet)', `T ${rm('=')} ${bar('T')} ${rm('on Γ')}<sub>D</sub>`],
    ['Heat flux (Neumann)', `${rm('-')}k${frac('∂T','∂n')} ${rm('=')} ${bar('q')} ${rm('on Γ')}<sub>N</sub>`],
    ['Convective (Robin)', `${rm('-')}k${frac('∂T','∂n')} ${rm('=')} h${rm('(')}T ${rm('-')} T<sub>∞</sub>${rm(') on Γ')}<sub>conv</sub>`],
    ['Insulated', `${frac('∂T','∂n')} ${rm('=')} 0 ${rm('on Γ')}<sub>ins</sub>`],
  ];
  rowsEq.forEach(([label, html])=>{
    const line = document.createElement('div'); line.style.marginBottom='8px';
    const lbl = document.createElement('div'); lbl.className='eq-note'; lbl.style.marginTop='0'; lbl.style.fontWeight='600'; lbl.textContent=label;
    const eq = document.createElement('div'); eq.className='equation'; eq.style.fontSize='15px'; eq.innerHTML=html;
    line.appendChild(lbl); line.appendChild(eq);
    eqList.appendChild(line);
  });
  const noteEq = document.createElement('div'); noteEq.className='eq-note';
  noteEq.innerHTML = `<b>n</b> คือทิศทางตั้งฉากกับขอบ (normal direction), ${bar('T')} คืออุณหภูมิที่กำหนด, ${bar('q')} คือฟลักซ์ความร้อนที่กำหนด (ค่าบวก = ความร้อนไหลเข้าสู่โมเดล), <b>h</b> คือสัมประสิทธิ์การพาความร้อน (convective heat transfer coefficient), <b>T∞</b> คืออุณหภูมิของของไหลโดยรอบ (ambient/fluid temperature)`;
  eqList.appendChild(noteEq);
  main.appendChild(eqList);

  const labels = edgeLabels();
  const edgeNames = getEdgeNamesForShape();
  const table = document.createElement('table'); table.className='bc-table';
  table.innerHTML = `<thead><tr><th>ขอบ</th><th>ประเภท</th><th>ค่า</th></tr></thead>`;
  const tbody = document.createElement('tbody');

  edgeNames.forEach(edgeName=>{
    const tr = document.createElement('tr');
    const tdName = document.createElement('td'); tdName.textContent = labels[edgeName];
    tdName.addEventListener('mouseenter', ()=> highlightPreview(edgeName));
    tdName.addEventListener('mouseleave', ()=> highlightPreview(null));

    const tdType = document.createElement('td');
    const sel = document.createElement('select');
    [['insulated','Insulated'],['fixed','Fixed temperature'],['flux','Heat flux'],['convective','Convective (h, T∞)']].forEach(([v,l])=>{
      const o = document.createElement('option'); o.value=v; o.textContent=l;
      if(state.bc[edgeName].type===v) o.selected=true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', ()=>{
      state.bc[edgeName].type = sel.value;
      if(sel.value==='convective'){
        if(state.bc[edgeName].h===undefined) state.bc[edgeName].h = 10;
        if(state.bc[edgeName].Tinf===undefined) state.bc[edgeName].Tinf = 25;
      }
      renderMain();
    });
    tdType.appendChild(sel);

    const tdVal = document.createElement('td');
    if(state.bc[edgeName].type === 'insulated'){
      tdVal.innerHTML = '<span class="unit">— ไม่มีการไหลของความร้อนผ่านขอบนี้ —</span>';
    } else if(state.bc[edgeName].type === 'convective'){
      const hInp = document.createElement('input'); hInp.type='number'; hInp.step='any';
      hInp.value = state.bc[edgeName].h; hInp.placeholder='h';
      hInp.style.width='70px';
      hInp.addEventListener('input', ()=>{ const v=parseFloat(hInp.value); state.bc[edgeName].h = isNaN(v)?0:v; });
      const tInp = document.createElement('input'); tInp.type='number'; tInp.step='any';
      tInp.value = state.bc[edgeName].Tinf; tInp.placeholder='T∞';
      tInp.style.width='70px'; tInp.style.marginLeft='6px';
      tInp.addEventListener('input', ()=>{ const v=parseFloat(tInp.value); state.bc[edgeName].Tinf = isNaN(v)?0:v; });
      const commit = ()=>{
        state.bc[edgeName].h = isNaN(parseFloat(hInp.value)) ? 0 : parseFloat(hInp.value);
        state.bc[edgeName].Tinf = isNaN(parseFloat(tInp.value)) ? 0 : parseFloat(tInp.value);
        renderMain();
      };
      hInp.addEventListener('keydown', (e)=>{ if(e.key==='Enter') commit(); });
      tInp.addEventListener('keydown', (e)=>{ if(e.key==='Enter') commit(); });
      const setBtn = document.createElement('button'); setBtn.className='secondary'; setBtn.textContent='Set';
      setBtn.style.padding='6px 12px'; setBtn.style.fontSize='11.5px'; setBtn.style.marginLeft='6px';
      setBtn.onclick = commit;
      tdVal.appendChild(hInp); tdVal.appendChild(tInp); tdVal.appendChild(setBtn);
      const hint = document.createElement('div'); hint.className='unit'; hint.style.marginTop='4px';
      hint.textContent = 'h: W/(m²·K)   T∞: °C';
      tdVal.appendChild(hint);
    } else {
      const inp = document.createElement('input'); inp.type='number'; inp.step='any';
      inp.value = state.bc[edgeName].value;
      inp.placeholder = state.bc[edgeName].type==='fixed' ? '°C' : 'W/m²';
      inp.addEventListener('input', ()=>{
        const v = parseFloat(inp.value);
        state.bc[edgeName].value = isNaN(v)?0:v;
      });
      inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ renderMain(); } });
      tdVal.appendChild(inp);
      const setBtn = document.createElement('button'); setBtn.className='secondary'; setBtn.textContent='Set';
      setBtn.style.padding='6px 12px'; setBtn.style.fontSize='11.5px'; setBtn.style.marginLeft='6px';
      setBtn.onclick = ()=>{
        const v = parseFloat(inp.value);
        state.bc[edgeName].value = isNaN(v)?0:v;
        renderMain();
      };
      tdVal.appendChild(setBtn);
      const hint = document.createElement('span'); hint.className='unit'; hint.style.marginLeft='8px';
      hint.textContent = state.bc[edgeName].type==='fixed' ? '°C' : (state.dimension==='1d' ? 'W (A=1 m², เข้าสู่โมเดล = บวก)' : 'W/m² (เข้าสู่โมเดล = บวก)');
      tdVal.appendChild(hint);
    }

    tr.appendChild(tdName); tr.appendChild(tdType); tr.appendChild(tdVal);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  main.appendChild(table);
  const setHint = document.createElement('div'); setHint.className='eq-note';
  setHint.textContent = 'พิมพ์ค่าแล้วกด "Set" (หรือ Enter) เพื่อยืนยัน — กล่องสรุปด้านล่างจะอัปเดตทันทีที่กดยืนยัน';
  main.appendChild(setHint);

  const appliedWrap = document.createElement('div'); appliedWrap.style.margin='14px 0';
  const fluxUnit = state.dimension==='1d' ? 'W' : 'W/m²';
  edgeNames.forEach(edgeName=>{
    const bc = state.bc[edgeName];
    let text;
    if(bc.type==='fixed') text = `T = ${bc.value} °C   on ${labels[edgeName]}`;
    else if(bc.type==='flux') text = `-k·∂T/∂n = ${bc.value} ${fluxUnit}   on ${labels[edgeName]}`;
    else if(bc.type==='convective') text = `-k·∂T/∂n = h(T-T∞), h=${bc.h} W/(m²·K), T∞=${bc.Tinf} °C   on ${labels[edgeName]}`;
    else text = `∂T/∂n = 0   on ${labels[edgeName]}  (insulated)`;
    const line = document.createElement('div'); line.className='eq-applied'; line.style.marginRight='8px';
    line.textContent = text;
    appliedWrap.appendChild(line);
  });
  main.appendChild(appliedWrap);

  const wrap = document.createElement('div'); wrap.className='canvas-wrap';
  let cv;
  if(state.dimension==='1d'){
    cv = document.createElement('canvas'); cv.width=520; cv.height=140; cv.id='bcCanvas';
    wrap.appendChild(cv);
    main.appendChild(wrap);
    draw1DDomain(cv, state.geom.length);
  } else {
    cv = document.createElement('canvas'); cv.width=460; cv.height=300; cv.id='bcCanvas';
    wrap.appendChild(cv);
    main.appendChild(wrap);
    drawPreviewShape(cv);
  }

  const hasFixed = Object.values(state.bc).some(b=>b.type==='fixed');
  const hasConvective = Object.values(state.bc).some(b=>b.type==='convective');
  const canProceed = hasFixed || hasConvective;
  if(!canProceed){
    const note = document.createElement('div'); note.className='note';
    note.textContent = 'ต้องกำหนด Fixed temperature หรือ Convective อย่างน้อย 1 ขอบ ก่อนตีเมชและรันการจำลอง มิฉะนั้นระบบสมการจะไม่มีคำตอบที่แน่นอน';
    main.appendChild(note);
  }

  navButtons(main, { back:true, next:canProceed, nextDisabled:!canProceed, nextLabel:'ไปหน้าตีเมช →', onNext:()=>{ state.step=4; renderAll(); } });
}

function highlightPreview(edgeName){
  const cv = document.getElementById('bcCanvas');
  if(!cv) return;
  if(state.dimension==='1d'){
    draw1DDomain(cv, state.geom.length, {highlight: edgeName});
    return;
  }
  drawPreviewShape(cv, edgeName);
}

/* --- Step 6: Solve & Results --- */
function renderSolveStep(main){
  const dimWord = state.dimension==='1d' ? '1D bar elements' : (state.elementOrder==='linear' ? 'linear (3-node) triangular elements' : 'quadratic (6-node) triangular elements');
  const isTransient = state.analysisType==='transient';
  makeTitle(main, 'รันการจำลองและดูผลลัพธ์', `ระบบจะประกอบสมการไฟไนต์เอลิเมนต์ (${dimWord}) แล้วแก้ระบบสมการด้วยวิธีที่เลือกด้านล่าง`);

  eqBlock(main, isTransient ? 'ระบบสมการที่ถูกประกอบขึ้น (semi-discrete FEM system)' : 'ระบบสมการที่ถูกประกอบขึ้น (discretized FEM system)',
    isTransient ? `${rm('[')}M${rm(']{')}dT/dt${rm('} + [')}K${rm(']{')}T${rm('} = {')}F${rm('}')}` : `${rm('[')}K${rm(']{')}T${rm('} = {')}F${rm('}')}`,
    isTransient ? 'เมทริกซ์มวลความร้อน (mass matrix [M], จาก ρc) และเมทริกซ์ความแข็งเกร็ง [K] ประกอบจากทุกเอลิเมนต์ แล้วเดินเวลาด้วย Backward Euler:'
                : 'เมทริกซ์ความแข็งเกร็ง (stiffness matrix) และเวกเตอร์โหลด (load vector) คำนวณจากทุกเอลิเมนต์ในเมชและเงื่อนไขขอบเขตที่กำหนดไว้:'
  );
  const solveDetail = document.createElement('div'); solveDetail.className='eq-block';
  if(isTransient){
    const l1 = document.createElement('div'); l1.className='equation'; l1.style.fontSize='14.5px';
    l1.innerHTML = `${rm('(')}M ${rm('+')} ${rm('Δt')}K${rm(')')} T<sup>n+1</sup> ${rm('=')} M T<sup>n</sup> ${rm('+')} ${rm('Δt')} F`;
    solveDetail.appendChild(l1);
    const noteDetail = document.createElement('div'); noteDetail.className='eq-note';
    noteDetail.textContent = 'สมการนี้เป็นระบบเชิงเส้นคงที่ (ไม่เปลี่ยนตามเวลา เพราะ Δt คงที่) จึงแก้ครั้งเดียวแล้วนำกลับมาใช้ซ้ำทุก time step ได้อย่างมีประสิทธิภาพ';
    solveDetail.appendChild(noteDetail);
  } else if(state.dimension==='1d'){
    const l1 = document.createElement('div'); l1.className='equation'; l1.style.fontSize='14.5px';
    l1.innerHTML = `K<sub>ij</sub> ${rm('=')} ${rm('∫')}<sub>0</sub><sup>L</sup> k${frac('dN','dx')}<sub>i</sub>${frac('dN','dx')}<sub>j</sub> ${rm('dx')}`;
    const l2 = document.createElement('div'); l2.className='equation'; l2.style.fontSize='14.5px'; l2.style.marginTop='6px';
    l2.innerHTML = `F<sub>i</sub> ${rm('=')} ${rm('∫')}<sub>0</sub><sup>L</sup> Q N<sub>i</sub> ${rm('dx')} ${rm('+')} ${bar('q')}N<sub>i</sub>${rm('|')}<sub>boundary</sub>`;
    solveDetail.appendChild(l1); solveDetail.appendChild(l2);
    const noteDetail = document.createElement('div'); noteDetail.className='eq-note';
    noteDetail.textContent = 'จากนั้นบังคับเงื่อนไข Fixed temperature ลงในระบบสมการ แล้วแก้หา {T} ด้วยวิธีที่เลือกด้านล่าง';
    solveDetail.appendChild(noteDetail);
  } else {
    const l1 = document.createElement('div'); l1.className='equation'; l1.style.fontSize='14.5px';
    l1.innerHTML = `K<sub>ij</sub> ${rm('=')} ${rm('∫∫')}<sub>Ω</sub> k${rm('(')}${frac('∂N','∂x')}<sub>i</sub>${frac('∂N','∂x')}<sub>j</sub> ${rm('+')} ${frac('∂N','∂y')}<sub>i</sub>${frac('∂N','∂y')}<sub>j</sub>${rm(') dA')}`;
    const l2 = document.createElement('div'); l2.className='equation'; l2.style.fontSize='14.5px'; l2.style.marginTop='6px';
    l2.innerHTML = `F<sub>i</sub> ${rm('=')} ${rm('∫∫')}<sub>Ω</sub> Q N<sub>i</sub> ${rm('dA')} ${rm('+')} ${rm('∫')}<sub>Γ<sub>N</sub></sub> ${bar('q')} N<sub>i</sub> ${rm('dΓ')}`;
    solveDetail.appendChild(l1); solveDetail.appendChild(l2);
    const noteDetail = document.createElement('div'); noteDetail.className='eq-note';
    noteDetail.textContent = 'จากนั้นบังคับเงื่อนไข Fixed temperature ลงในระบบสมการ แล้วแก้หา {T} ด้วยวิธีที่เลือกด้านล่าง';
    solveDetail.appendChild(noteDetail);
  }
  main.appendChild(solveDetail);

  // --- Solver method selection ---
  const methodInfo = {
    cg:    { label:'Conjugate Gradient', desc: isTransient
              ? 'วิธีวนซ้ำ (iterative) — สำหรับ transient จะเริ่มจากคำตอบของ step ก่อนหน้าเสมอ (warm start) ทำให้ลู่เข้าเร็วในแต่ละ step'
              : 'วิธีวนซ้ำ (iterative) สำหรับระบบสมการที่มี matrix สมมาตรบวกแน่นอน (SPD) — เร็วและประหยัดหน่วยความจำสำหรับเมชขนาดใหญ่' },
    direct:{ label:'Direct (LU decomposition)', desc: isTransient
              ? 'วิธีตรง (direct) — แยกตัวประกอบ (factorize) เมทริกซ์เพียงครั้งเดียวก่อนเริ่มเดินเวลา แล้วใช้ซ้ำทุก step (เร็วกว่าการแก้ใหม่ทุกครั้งมาก)'
              : 'วิธีตรง (direct) แก้สมการด้วยการแยกตัวประกอบ LU ให้คำตอบในจำนวนขั้นตอนที่แน่นอน แต่ใช้เวลานานขึ้นมากเมื่อเมชมีขนาดใหญ่ (O(n³))' },
  };
  const methodRow = document.createElement('div'); methodRow.className='field-row';
  const mf = document.createElement('div'); mf.className='field'; mf.style.minWidth='280px';
  mf.innerHTML = `<label>วิธีแก้ระบบสมการ (solver method)</label>`;
  const msel = document.createElement('select');
  Object.entries(methodInfo).forEach(([v,info])=>{
    const o = document.createElement('option'); o.value=v; o.textContent=info.label;
    if(state.solverMethod===v) o.selected=true;
    msel.appendChild(o);
  });
  msel.addEventListener('change', ()=>{ state.solverMethod = msel.value; renderMain(); });
  mf.appendChild(msel);
  methodRow.appendChild(mf);
  main.appendChild(methodRow);
  const methodDesc = document.createElement('div'); methodDesc.className='eq-note'; methodDesc.style.marginBottom='14px';
  methodDesc.textContent = methodInfo[state.solverMethod].desc;
  main.appendChild(methodDesc);
  if(state.solverMethod==='direct' && state.mesh.nodes.length>600 && !isTransient){
    const warn = document.createElement('div'); warn.className='note';
    warn.textContent = `เมชปัจจุบันมี ${state.mesh.nodes.length} โหนด — วิธี Direct อาจใช้เวลาคำนวณนานพอสมควร (O(n³)) ลองลดความละเอียดเมชหรือเลือกวิธี Conjugate Gradient แทนหากต้องการความเร็ว`;
    main.appendChild(warn);
  }
  if(isTransient && state.mesh.nodes.length>500){
    const warn = document.createElement('div'); warn.className='note';
    warn.textContent = `เมชปัจจุบันมี ${state.mesh.nodes.length} โหนด และจะรัน ${state.transient.steps} time steps — การจำลอง transient บนเมชขนาดใหญ่อาจใช้เวลาสักครู่`;
    main.appendChild(warn);
  }

  const errDiv = document.createElement('div'); errDiv.className='error';
  main.appendChild(errDiv);

  const runBtn = document.createElement('button'); runBtn.className='primary'; runBtn.textContent='▶ รันการจำลอง (Solve)';
  runBtn.style.marginBottom='16px';
  runBtn.onclick = ()=>{
    errDiv.style.display='none';
    try{
      if(isTransient) solveTransientHeatConduction();
      else solveHeatConduction();
    } catch(e){
      errDiv.textContent = e.message;
      errDiv.style.display='block';
      state.results = null;
    }
    if(state.results) state.transientViewStep = state.results.transient ? state.results.steps : 0;
    renderAll();
  };
  main.appendChild(runBtn);

  if(!state.results){
    const wrap = document.createElement('div'); wrap.className='canvas-wrap';
    if(state.dimension==='1d'){
      const cv = document.createElement('canvas'); cv.width=520; cv.height=140;
      wrap.appendChild(cv); main.appendChild(wrap);
      draw1DMesh(cv, state.mesh);
    } else {
      const cv = document.createElement('canvas'); cv.width=480; cv.height=340;
      wrap.appendChild(cv); main.appendChild(wrap);
      drawMeshCanvas(cv, state.mesh, false);
    }
    navButtons(main, { back:true, next:false });
    return;
  }

  // --- Solver info ---
  const solverInfoBox = document.createElement('div'); solverInfoBox.className='eq-applied'; solverInfoBox.style.display='block'; solverInfoBox.style.marginBottom='16px';
  solverInfoBox.textContent = state.results.info;
  main.appendChild(solverInfoBox);

  if(state.results.transient){
    renderTransientResults(main);
  } else {
    renderSteadyResults(main);
  }

  navButtons(main, { back:true, next:false });
}

function renderTransientResults(main){
  const results = state.results;
  if(state.transientViewStep===undefined || state.transientViewStep===null) state.transientViewStep = results.steps;
  state.transientViewStep = Math.max(0, Math.min(results.steps, state.transientViewStep));

  const timeRow = document.createElement('div'); timeRow.className='field-row'; timeRow.style.alignItems='flex-end';
  const tf = document.createElement('div'); tf.className='field'; tf.style.minWidth='320px';
  tf.innerHTML = `<label>เวลา (time): <b id="tVal">t = ${results.timeSeries[state.transientViewStep].t.toFixed(4)} s</b> (step ${state.transientViewStep} / ${results.steps})</label>`;
  const tslider = document.createElement('input'); tslider.type='range'; tslider.min='0'; tslider.max=String(results.steps); tslider.value=String(state.transientViewStep);
  tf.appendChild(tslider);
  timeRow.appendChild(tf);
  main.appendChild(timeRow);

  let cv, cbCanvas=null;
  if(state.dimension==='1d'){
    const wrap = document.createElement('div'); wrap.className='canvas-wrap';
    cv = document.createElement('canvas'); cv.width=560; cv.height=320;
    wrap.appendChild(cv); main.appendChild(wrap);
  } else {
    const wrap = document.createElement('div'); wrap.className='canvas-wrap'; wrap.style.display='flex'; wrap.style.gap='16px'; wrap.style.flexWrap='wrap';
    cv = document.createElement('canvas'); cv.width=440; cv.height=320;
    wrap.appendChild(cv);

    const CB_HEIGHT = 200;
    const cbWrap = document.createElement('div'); cbWrap.className='colorbar';
    cbCanvas = document.createElement('canvas'); cbCanvas.width=24; cbCanvas.height=CB_HEIGHT;
    const ticksCol = document.createElement('div'); ticksCol.className='ticks';
    ticksCol.style.height = CB_HEIGHT+'px'; ticksCol.style.width='46px';
    for(let i=0;i<=10;i++){
      const yPx = (CB_HEIGHT-1)*(i/10);
      const val = results.max - i*(results.max-results.min)/10;
      const t = document.createElement('span'); t.style.top=yPx+'px'; t.textContent=val.toFixed(1)+'°';
      ticksCol.appendChild(t);
    }
    cbWrap.appendChild(cbCanvas); cbWrap.appendChild(ticksCol);
    wrap.appendChild(cbWrap);
    main.appendChild(wrap);
    drawColorbarInto(cbCanvas);
  }

  function renderFrame(){
    const idx = state.transientViewStep;
    const s = results.timeSeries[idx];
    tslider.value = String(idx);
    const tValEl = document.getElementById('tVal');
    if(tValEl) tValEl.textContent = `t = ${s.t.toFixed(4)} s`;
    const lbl = tslider.parentElement.querySelector('label');
    if(lbl) lbl.innerHTML = `เวลา (time): <b id="tVal">t = ${s.t.toFixed(4)} s</b> (step ${idx} / ${results.steps})`;
    if(state.dimension==='1d'){
      draw1DResultsChart(cv, state.mesh, s.T, null);
    } else {
      drawMeshCanvas(cv, state.mesh, true, {T:s.T, min:results.min, max:results.max});
    }
  }
  renderFrame();

  // --- Playback controls (10 fps, like a short video of the simulation) ---
  const playRow = document.createElement('div'); playRow.className='actions'; playRow.style.marginTop='10px';
  const playBtn = document.createElement('button'); playBtn.className='primary';
  const pauseBtn = document.createElement('button'); pauseBtn.className='secondary'; pauseBtn.textContent='⏸ หยุดชั่วคราว';
  const restartBtn = document.createElement('button'); restartBtn.className='secondary'; restartBtn.textContent='⏮ เริ่มใหม่';
  playRow.appendChild(playBtn); playRow.appendChild(pauseBtn); playRow.appendChild(restartBtn);
  main.appendChild(playRow);
  const fpsNote = document.createElement('div'); fpsNote.className='unit'; fpsNote.style.margin='4px 0 12px 0';
  fpsNote.textContent = `เล่นผลลัพธ์ทุก time step ต่อเนื่องกันที่ 10 เฟรม/วินาที (100 ms ต่อเฟรม) — วนซ้ำอัตโนมัติเมื่อจบ`;
  main.appendChild(fpsNote);

  function syncButtons(){
    const playing = !!playbackTimer;
    playBtn.textContent = playing ? '▶ กำลังเล่น...' : '▶ เล่น';
    playBtn.disabled = playing;
    pauseBtn.disabled = !playing;
  }

  tslider.addEventListener('input', ()=>{
    stopPlayback();
    state.transientViewStep = parseInt(tslider.value);
    renderFrame();
    syncButtons();
  });
  playBtn.onclick = () => {
    stopPlayback();
    if(state.transientViewStep >= results.steps) state.transientViewStep = 0;
    playbackTimer = setInterval(()=>{
      state.transientViewStep++;
      if(state.transientViewStep > results.steps) state.transientViewStep = 0; // loop
      renderFrame();
    }, 100);
    syncButtons();
  };
  pauseBtn.onclick = () => { stopPlayback(); syncButtons(); };
  restartBtn.onclick = () => { stopPlayback(); state.transientViewStep=0; renderFrame(); syncButtons(); };
  syncButtons();

  const note = document.createElement('div'); note.className='eq-note'; note.style.marginTop='10px';
  note.textContent = `สเกลสีคงที่ตลอดช่วงเวลา (${results.min.toFixed(2)}–${results.max.toFixed(2)} °C) เพื่อให้เปรียบเทียบระหว่างช่วงเวลาต่าง ๆ ได้อย่างถูกต้อง — ${results.exact.note}`;
  main.appendChild(note);
}

function renderSteadyResults(main){
  if(state.dimension==='1d'){
    const wrap = document.createElement('div'); wrap.className='canvas-wrap';
    const cv = document.createElement('canvas'); cv.width=560; cv.height=320;
    wrap.appendChild(cv); main.appendChild(wrap);
    draw1DResultsChart(cv, state.mesh, state.results.T, state.results.exact.available ? state.results.exact.T : null);
  } else {
    const wrap = document.createElement('div'); wrap.className='canvas-wrap'; wrap.style.display='flex'; wrap.style.gap='16px'; wrap.style.flexWrap='wrap';
    const cv = document.createElement('canvas'); cv.width=440; cv.height=320;
    wrap.appendChild(cv);

    const CB_HEIGHT = 200;
    const cbWrap = document.createElement('div'); cbWrap.className='colorbar';
    const cbCanvas = document.createElement('canvas'); cbCanvas.width=24; cbCanvas.height=CB_HEIGHT;
    const ticksCol = document.createElement('div'); ticksCol.className='ticks';
    ticksCol.style.height = CB_HEIGHT+'px';
    ticksCol.style.width = '46px';
    for(let i=0;i<=10;i++){
      const yPx = (CB_HEIGHT-1) * (i/10);
      const val = state.results.max - i*(state.results.max-state.results.min)/10;
      const t = document.createElement('span'); t.style.top = yPx+'px'; t.textContent = val.toFixed(1)+'°';
      ticksCol.appendChild(t);
    }
    cbWrap.appendChild(cbCanvas); cbWrap.appendChild(ticksCol);
    wrap.appendChild(cbWrap);

    let cvExact=null;
    if(state.results.exact.available){
      const exactWrap = document.createElement('div');
      const exactLbl = document.createElement('div'); exactLbl.className='unit'; exactLbl.style.marginBottom='4px'; exactLbl.textContent='Exact solution (สำหรับเปรียบเทียบ)';
      exactWrap.appendChild(exactLbl);
      cvExact = document.createElement('canvas'); cvExact.width=300; cvExact.height=220;
      exactWrap.appendChild(cvExact);
      wrap.appendChild(exactWrap);
    }
    main.appendChild(wrap);

    drawMeshCanvas(cv, state.mesh, true);
    drawColorbarInto(cbCanvas);
    if(cvExact) drawExactContour(cvExact, state.mesh, state.results.exact.T, state.results.min, state.results.max);
  }

  // --- Exact solution comparison panel ---
  const exact = state.results.exact;
  const exBox = document.createElement('div'); exBox.className='eq-block'; exBox.style.marginTop='16px';
  if(exact.available){
    exBox.innerHTML = `<div class="eq-caption" style="margin-bottom:8px;">เปรียบเทียบกับ Exact Solution — ${exact.method}</div>`;
    const statsRow = document.createElement('div'); statsRow.style.display='flex'; statsRow.style.gap='28px'; statsRow.style.fontFamily='var(--mono)'; statsRow.style.marginBottom='8px';
    statsRow.innerHTML = `
      <div><div class="unit">Max error</div><div style="font-size:17px; font-weight:700; color:var(--mint-deep);">${exact.maxErr.toExponential(3)} °C</div></div>
      <div><div class="unit">RMS error</div><div style="font-size:17px; font-weight:700; color:var(--mint-deep);">${exact.rmsErr.toExponential(3)} °C</div></div>`;
    exBox.appendChild(statsRow);
    const noteEl = document.createElement('div'); noteEl.className='eq-note'; noteEl.textContent = exact.note + (exact.statsExcludeBoundary ? ' (คำนวณ error จากโหนดภายในเท่านั้น)' : '');
    exBox.appendChild(noteEl);
  } else {
    exBox.innerHTML = `<div class="eq-caption" style="margin-bottom:8px;">Exact Solution</div>`;
    const noteEl = document.createElement('div'); noteEl.className='eq-note'; noteEl.textContent = exact.note;
    exBox.appendChild(noteEl);
  }
  main.appendChild(exBox);
}

function drawColorbarInto(canvas){
  const ctx = canvas.getContext('2d');
  const H = canvas.height;
  for(let y=0;y<H;y++){
    const t = 1 - y/(H-1);
    ctx.fillStyle = rainbowColor(t);
    ctx.fillRect(0,y,canvas.width,1);
  }
}

function drawExactContour(canvas, mesh, Texact, min, max){
  const tf = fitTransform(mesh.bbox, canvas.width, canvas.height, 18);
  fillContourGradient(canvas, mesh, Texact, min, max, tf);
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#3A4145'; ctx.lineWidth=1.2;
  drawOutline(ctx, mesh, tf);
}

/* ============================= INFO PANEL ============================= */
function renderInfo(){
  const info = document.getElementById('infoPanel');
  info.innerHTML = '<h2>สรุปโมเดล</h2>';

  const rows = [];
  rows.push(['สมการ', state.equation==='heat' ? 'Heat Transfer' : '-']);
  rows.push(['รูปแบบ', state.analysisType==='steady' ? 'Steady state' : 'Transient']);
  rows.push(['มิติ', state.dimension==='1d' ? '1D' : '2D']);
  if(state.dimension==='1d'){
    rows.push(['ความยาว', `${state.geom.length} m`]);
  } else if(state.shape==='rectangle'){
    rows.push(['รูปทรง', 'สี่เหลี่ยม']);
    rows.push(['ขนาด', `${state.geom.width} × ${state.geom.height} m`]);
  } else {
    const bbox = bboxFor2DShape();
    rows.push(['รูปทรง', 'วาดเอง (custom polygon)']);
    rows.push(['จำนวนจุด/ขอบ', polygonVertexCount()]);
    rows.push(['ขนาดกรอบ', `${bbox.w.toFixed(2)} × ${bbox.h.toFixed(2)} m`]);
  }
  rows.push(['k', state.material.k + ' W/(m·K)']);
  if(state.material.Q) rows.push(['Q', state.material.Q + ' W/m³']);
  if(state.analysisType==='transient'){
    rows.push(['ρ', state.material.rho + ' kg/m³']);
    rows.push(['cp', state.material.cp + ' J/(kg·K)']);
    rows.push(['ρc', (state.material.rho*state.material.cp) + ' J/(m³·K)']);
    rows.push(['T₀', state.transient.T0 + ' °C']);
    rows.push(['เวลาสิ้นสุด', state.transient.totalTime + ' s']);
    rows.push(['time steps', state.transient.steps]);
  }
  if(state.mesh){
    rows.push(['Element order', state.elementOrder==='linear' ? 'First order' : 'Second order']);
    rows.push(['จำนวนโหนด', state.mesh.nodes.length]);
    rows.push(['จำนวนเอลิเมนต์', state.mesh.elements.length]);
  }
  if(state.results){
    const methodLabels = {cg:'Conjugate Gradient', direct:'Direct (LU)'};
    rows.push(['Solver', methodLabels[state.solverMethod]]);
    if(state.results.transient){
      const idx = (state.transientViewStep!==undefined && state.transientViewStep!==null) ? state.transientViewStep : state.results.steps;
      const snap = state.results.timeSeries[Math.max(0,Math.min(state.results.steps, idx))];
      rows.push(['กำลังดูที่ t', snap.t.toFixed(4)+' s']);
      rows.push(['T min (ทุกเวลา)', state.results.min.toFixed(3)+' °C']);
      rows.push(['T max (ทุกเวลา)', state.results.max.toFixed(3)+' °C']);
      rows.push(['Exact solution', 'ยังไม่รองรับสำหรับ transient']);
    } else {
      rows.push(['T min', state.results.min.toFixed(3)+' °C']);
      rows.push(['T max', state.results.max.toFixed(3)+' °C']);
      rows.push(['รอบ/step', state.results.iters]);
      if(state.results.exact.available){
        rows.push(['Exact solution', 'มี — ' + state.results.exact.method]);
        rows.push(['Max error', state.results.exact.maxErr.toExponential(2)+' °C']);
      } else {
        rows.push(['Exact solution', 'ไม่มีสูตรปิดสำหรับกรณีนี้']);
      }
    }
  }

  rows.forEach(([k,v])=>{
    const d = document.createElement('div'); d.className='stat-line';
    d.innerHTML = `<span>${k}</span><span>${v}</span>`;
    info.appendChild(d);
  });

  const note = document.createElement('div'); note.className='note';
  note.textContent = 'แอปนี้ทำงานในเบราว์เซอร์ทั้งหมด ไม่มีการส่งหรือบันทึกข้อมูลใด ๆ — ปิดหน้าต่างแล้วข้อมูลทั้งหมดจะหายไป';
  info.appendChild(note);
}

/* ============================= INIT ============================= */
renderAll();
</script>
