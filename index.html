<body>

<header>
  <h1>FEMFEd — โปรแกรมจำลองไฟไนต์เอลิเมนต์เพื่อการศึกษา (Finite Element Method For Education)</h1>
</header>

<div class="layout">
  <nav class="steps" id="stepsNav"></nav>
  <main id="mainPanel"></main>
  <aside class="info" id="infoPanel"></aside>
</div>

<script>
/* ============================= STATE ============================= */
const state = {
  step: 0,
  equation: 'heat',           // only 'heat' implemented
  analysisType: 'steady',     // only 'steady' implemented
  dimension: '2d',            // '1d' | '2d'
  shape: 'rectangle',         // 'line' | 'rectangle' | 'polygon'
  geom: { width: 1.0, height: 0.6, length: 1.0 },
  polygon: { vertices: [] }, // freeform polygon drawn by the user (meters, normalized to touch x=0,y=0)
  material: { k: 1.0, Q: 0.0, rho: 1.0, cp: 1.0 },
  maxElements: 500,           // target max element count for auto mesh (capped at 5000)
  elementOrder: 'linear',     // 'linear' (3-node/2-node) | 'quadratic' (6-node/3-node)
  solverMethod: 'cg',         // 'cg' | 'direct'
  transient: { T0: 0, totalTime: 10, steps: 50 },
  mesh: null,                 // {nodes, elements, boundaries, order, dim}
  bc: {},                     // edgeName -> {type:'insulated'|'fixed'|'flux', value:number}
  results: null               // {T, min, max, iters, info, exact:{...}}
};

const STEPS = [
  { key:'equation', label:'เลือกสมการ' },
  { key:'geometry', label:'สร้างรูปทรง' },
  { key:'material', label:'คุณสมบัติวัสดุ' },
  { key:'bc', label:'เงื่อนไขเริ่มต้น/ขอบเขต' },
  { key:'mesh', label:'ตีเมช' },
  { key:'solve', label:'รันและดูผล' },
];

/* ============================= MESH GENERATION ============================= */
function buildLineMesh(length, divisions){
  const n = Math.max(1, Math.round(divisions));
  const dx = length/n;
  const nodes = [];
  for(let i=0;i<=n;i++) nodes.push({x:i*dx, y:0});
  const elements = [];
  for(let i=0;i<n;i++) elements.push([i,i+1]);
  return { nodes, elements, boundaries:{left:[0], right:[n]}, bbox:{w:length,h:length}, dim:'1d' };
}

function quadraticizeLine(mesh){
  const nodes = mesh.nodes.slice();
  const elements = mesh.elements.map(([a,b])=>{
    const p=mesh.nodes[a], q=mesh.nodes[b];
    const idx = nodes.length;
    nodes.push({x:(p.x+q.x)/2, y:0});
    return [a, idx, b]; // order (endA, mid, endB) to match quadratic bar stiffness matrix
  });
  return { nodes, elements, boundaries: mesh.boundaries, bbox: mesh.bbox, order:'quadratic', dim:'1d' };
}

function buildRectangleMesh(width, height, divisions){
  const elSize = Math.min(width, height) / divisions;
  const nx = Math.max(1, Math.round(width / elSize));
  const ny = Math.max(1, Math.round(height / elSize));
  const dx = width / nx, dy = height / ny;
  const nodes = [];
  for(let j=0;j<=ny;j++){
    for(let i=0;i<=nx;i++){
      nodes.push({x: i*dx, y: j*dy});
    }
  }
  const idx = (i,j)=> j*(nx+1)+i;
  const elements = [];
  for(let j=0;j<ny;j++){
    for(let i=0;i<nx;i++){
      const n0=idx(i,j), n1=idx(i+1,j), n2=idx(i,j+1), n3=idx(i+1,j+1);
      elements.push([n0,n1,n3]);
      elements.push([n0,n3,n2]);
    }
  }
  const left=[], right=[], bottom=[], top=[];
  for(let j=0;j<=ny;j++) left.push(idx(0,j));
  for(let j=0;j<=ny;j++) right.push(idx(nx,j));
  for(let i=0;i<=nx;i++) bottom.push(idx(i,0));
  for(let i=0;i<=nx;i++) top.push(idx(i,ny));
  return { nodes, elements, boundaries: { left, right, bottom, top }, bbox:{w:width,h:height} };
}

/* ---- Polygon geometry helpers (for the freeform "draw" tool) ---- */
function polygonSignedArea2(vertices){
  let a=0;
  for(let i=0;i<vertices.length;i++){
    const p=vertices[i], q=vertices[(i+1)%vertices.length];
    a += p.x*q.y - q.x*p.y;
  }
  return a;
}

function segmentsIntersect(p1,p2,p3,p4){
  function cross(o,a,b){ return (a.x-o.x)*(b.y-o.y) - (a.y-o.y)*(b.x-o.x); }
  const d1=cross(p3,p4,p1), d2=cross(p3,p4,p2), d3=cross(p1,p2,p3), d4=cross(p1,p2,p4);
  if(((d1>0&&d2<0)||(d1<0&&d2>0)) && ((d3>0&&d4<0)||(d3<0&&d4>0))) return true;
  return false; // touching/collinear endpoints are tolerated (common when the user closes the loop)
}

function isSimplePolygon(vertices){
  const n = vertices.length;
  if(n<3) return false;
  for(let i=0;i<n;i++){
    const a1=vertices[i], a2=vertices[(i+1)%n];
    for(let j=i+1;j<n;j++){
      if(j===i || (j+1)%n===i || j===(i+1)%n) continue; // skip same/adjacent edges
      const b1=vertices[j], b2=vertices[(j+1)%n];
      if(segmentsIntersect(a1,a2,b1,b2)) return false;
    }
  }
  return true;
}

function pointInTriangleStrict(P,A,B,C){
  const d1=(P.x-B.x)*(A.y-B.y)-(A.x-B.x)*(P.y-B.y);
  const d2=(P.x-C.x)*(B.y-C.y)-(B.x-C.x)*(P.y-C.y);
  const d3=(P.x-A.x)*(C.y-A.y)-(C.x-A.x)*(P.y-A.y);
  const hasNeg=(d1<0)||(d2<0)||(d3<0), hasPos=(d1>0)||(d2>0)||(d3>0);
  return !(hasNeg && hasPos);
}

function triangulatePolygonEarClip(vertices){
  const n = vertices.length;
  const isCCW = polygonSignedArea2(vertices) > 0;
  let remaining = vertices.map((_,i)=>i);
  const triangles = [];
  let guard = 0;
  while(remaining.length > 3 && guard < 5000){
    guard++;
    let clipped = false;
    for(let i=0;i<remaining.length;i++){
      const m = remaining.length;
      const iPrev=(i-1+m)%m, iNext=(i+1)%m;
      const aIdx=remaining[iPrev], bIdx=remaining[i], cIdx=remaining[iNext];
      const A=vertices[aIdx], B=vertices[bIdx], C=vertices[cIdx];
      const cross = (B.x-A.x)*(C.y-A.y) - (B.y-A.y)*(C.x-A.x);
      const convex = isCCW ? cross > 1e-12 : cross < -1e-12;
      if(!convex) continue;
      let containsOther = false;
      for(let k=0;k<m;k++){
        if(k===iPrev||k===i||k===iNext) continue;
        if(pointInTriangleStrict(vertices[remaining[k]], A,B,C)){ containsOther=true; break; }
      }
      if(containsOther) continue;
      triangles.push(isCCW ? [aIdx,bIdx,cIdx] : [aIdx,cIdx,bIdx]);
      remaining.splice(i,1);
      clipped = true;
      break;
    }
    if(!clipped) break; // degenerate/near-collinear input; stop rather than loop forever
  }
  if(remaining.length===3){
    const [a,b,c]=remaining;
    triangles.push(isCCW ? [a,b,c] : [a,c,b]);
  }
  return triangles;
}

function buildPolygonMesh(vertices, maxElements){
  const n = vertices.length;
  const baseTriangles = triangulatePolygonEarClip(vertices);
  const baseCount = baseTriangles.length;
  let levels = 0;
  while(baseCount * Math.pow(4, levels+1) <= maxElements) levels++;

  let nodes = vertices.slice();
  let triangles = baseTriangles;
  const midMap = new Map();
  function key(i,j){ return i<j ? i+'_'+j : j+'_'+i; }
  function getMid(i,j){
    const k = key(i,j);
    if(midMap.has(k)) return midMap.get(k);
    const p=nodes[i], q=nodes[j];
    const idx = nodes.length;
    nodes.push({x:(p.x+q.x)/2, y:(p.y+q.y)/2});
    midMap.set(k, idx);
    return idx;
  }
  for(let lvl=0; lvl<levels; lvl++){
    const next = [];
    for(const [a,b,c] of triangles){
      const mab=getMid(a,b), mbc=getMid(b,c), mca=getMid(c,a);
      next.push([a,mab,mca],[mab,b,mbc],[mca,mbc,c],[mab,mbc,mca]);
    }
    triangles = next;
  }
  function edgeChain(a,b,level){
    if(level===0) return [a,b];
    const m = midMap.get(key(a,b));
    const left = edgeChain(a,m,level-1);
    const right = edgeChain(m,b,level-1);
    return left.concat(right.slice(1));
  }
  const boundaries = {};
  for(let i=0;i<n;i++){
    boundaries['edge'+i] = edgeChain(i, (i+1)%n, levels);
  }
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const v of vertices){ if(v.x<minX)minX=v.x; if(v.x>maxX)maxX=v.x; if(v.y<minY)minY=v.y; if(v.y>maxY)maxY=v.y; }
  return { nodes, elements:triangles, boundaries, bbox:{w:maxX-minX, h:maxY-minY} };
}

/* ---- Resolve "max element count" (UI control) into a rectangle grid divisions value ---- */
function rectDivisionsForTarget(width, height, maxEl){
  let best=1;
  for(let d=1; d<=500; d++){
    const elSize = Math.min(width,height)/d;
    const nx = Math.max(1, Math.round(width/elSize));
    const ny = Math.max(1, Math.round(height/elSize));
    if(2*nx*ny <= maxEl) best=d; else break;
  }
  return best;
}

function quadraticize(mesh){
  // Adds mid-side nodes to turn a 3-node linear mesh into a 6-node quadratic mesh.
  const nodes = mesh.nodes.slice();
  const edgeMap = new Map();
  function edgeKey(i,j){ return i<j ? i+'_'+j : j+'_'+i; }
  function getMid(i,j){
    const key = edgeKey(i,j);
    if(edgeMap.has(key)) return edgeMap.get(key);
    const p=mesh.nodes[i], q=mesh.nodes[j];
    const idx = nodes.length;
    nodes.push({x:(p.x+q.x)/2, y:(p.y+q.y)/2});
    edgeMap.set(key, idx);
    return idx;
  }
  const elements = mesh.elements.map(([a,b,c])=>{
    const m1=getMid(a,b), m2=getMid(b,c), m3=getMid(c,a);
    return [a,b,c,m1,m2,m3];
  });
  const boundaries = {};
  for(const key of Object.keys(mesh.boundaries)){
    const corners = mesh.boundaries[key];
    const list=[corners[0]];
    for(let s=0;s<corners.length-1;s++){
      const mid = getMid(corners[s], corners[s+1]);
      list.push(mid, corners[s+1]);
    }
    boundaries[key]=list;
  }
  return { nodes, elements, boundaries, bbox: mesh.bbox, order:'quadratic' };
}

function generateMesh(){
  const maxEl = Math.max(1, Math.min(5000, Math.round(state.maxElements)));
  let base;
  if(state.dimension==='1d'){
    base = buildLineMesh(state.geom.length, maxEl);
  } else if(state.shape==='rectangle'){
    const divisions = rectDivisionsForTarget(state.geom.width, state.geom.height, maxEl);
    base = buildRectangleMesh(state.geom.width, state.geom.height, divisions);
  } else {
    base = buildPolygonMesh(state.polygon.vertices, maxEl);
  }
  base.order = 'linear';
  if(state.elementOrder==='quadratic'){
    state.mesh = (state.dimension==='1d') ? quadraticizeLine(base) : quadraticize(base);
  } else {
    state.mesh = base;
  }
  // reset BCs to insulated default for the new edge set
  const edgeNames = Object.keys(state.mesh.boundaries);
  const newBc = {};
  edgeNames.forEach(e=>{ newBc[e] = state.bc[e] || {type:'insulated', value:0}; });
  state.bc = newBc;
}

/* ============================= FEM SOLVER ============================= */
function quadElementMatrices(coords, k, Q){
  // coords: [P1,P2,P3, Pmid12,Pmid23,Pmid31] for a 6-node (T6) quadratic triangle
  const [P1,P2,P3] = coords;
  const b1=P2.y-P3.y, b2=P3.y-P1.y, b3=P1.y-P2.y;
  const c1=P3.x-P2.x, c2=P1.x-P3.x, c3=P2.x-P1.x;
  const twoA = P1.x*(P2.y-P3.y)+P2.x*(P3.y-P1.y)+P3.x*(P1.y-P2.y);
  const area = Math.abs(twoA)/2;
  const Ke = new Array(36).fill(0);
  const Fe = new Array(6).fill(0);
  if(area < 1e-14) return {Ke, Fe};
  const inv2A = 1/twoA;
  const dLdx = [b1*inv2A, b2*inv2A, b3*inv2A];
  const dLdy = [c1*inv2A, c2*inv2A, c3*inv2A];
  // 3-point quadrature, exact for degree-2 polynomials (barycentric coords)
  const qp = [[2/3,1/6,1/6],[1/6,2/3,1/6],[1/6,1/6,2/3]];
  const w = area/3;
  for(const [L1,L2,L3] of qp){
    const N = [ L1*(2*L1-1), L2*(2*L2-1), L3*(2*L3-1), 4*L1*L2, 4*L2*L3, 4*L3*L1 ];
    const dNdL = [
      [4*L1-1, 0, 0], [0, 4*L2-1, 0], [0, 0, 4*L3-1],
      [4*L2, 4*L1, 0], [0, 4*L3, 4*L2], [4*L3, 0, 4*L1],
    ];
    const dNdx = new Array(6), dNdy = new Array(6);
    for(let i=0;i<6;i++){
      dNdx[i] = dNdL[i][0]*dLdx[0] + dNdL[i][1]*dLdx[1] + dNdL[i][2]*dLdx[2];
      dNdy[i] = dNdL[i][0]*dLdy[0] + dNdL[i][1]*dLdy[1] + dNdL[i][2]*dLdy[2];
    }
    for(let i=0;i<6;i++){
      for(let j=0;j<6;j++) Ke[i*6+j] += w*k*(dNdx[i]*dNdx[j] + dNdy[i]*dNdy[j]);
      if(Q!==0) Fe[i] += w*Q*N[i];
    }
  }
  return {Ke, Fe};
}

/* ---- Assemble global [K]{T}={F} for the current mesh/material/BCs ---- */
/* ---- Raw assembly (no Dirichlet elimination applied yet) — shared by steady & transient solves ---- */
function assembleRawSystem(){
  const {nodes, elements, boundaries} = state.mesh;
  const isQuadratic = state.mesh.order === 'quadratic';
  const is1D = state.mesh.dim === '1d';
  const n = nodes.length;
  const K = new Float64Array(n*n);
  const F = new Float64Array(n);
  const k = state.material.k;
  const Q = state.material.Q;

  function Kadd(i,j,v){ K[i*n+j]+=v; }

  if(is1D){
    if(!isQuadratic){
      for(const [a,b] of elements){
        const Le = Math.abs(nodes[b].x - nodes[a].x);
        if(Le < 1e-14) continue;
        const ke = k/Le;
        Kadd(a,a, ke); Kadd(a,b,-ke); Kadd(b,a,-ke); Kadd(b,b, ke);
        if(Q!==0){ const load=Q*Le/2; F[a]+=load; F[b]+=load; }
      }
    } else {
      for(const [a,m,b] of elements){
        const Le = Math.abs(nodes[b].x - nodes[a].x);
        if(Le < 1e-14) continue;
        const s = k/(3*Le);
        const KL = [[7*s,-8*s,1*s],[-8*s,16*s,-8*s],[1*s,-8*s,7*s]];
        const ids=[a,m,b];
        for(let i=0;i<3;i++) for(let j=0;j<3;j++) Kadd(ids[i],ids[j],KL[i][j]);
        if(Q!==0){ F[a]+=Q*Le/6; F[m]+=Q*Le*4/6; F[b]+=Q*Le/6; }
      }
    }
    // Point flux/convective BCs at the two ends (positive flux = entering the domain)
    for(const edgeName of Object.keys(boundaries)){
      const bc = state.bc[edgeName];
      if(!bc) continue;
      const node = boundaries[edgeName][0];
      if(bc.type === 'flux' && bc.value !== 0){
        F[node] += bc.value;
      } else if(bc.type === 'convective'){
        Kadd(node, node, bc.h);
        F[node] += bc.h * bc.Tinf;
      }
    }
  } else if(!isQuadratic){
    for(const [a,b,c] of elements){
      const A0=nodes[a], B0=nodes[b], C0=nodes[c];
      const area = 0.5*Math.abs((B0.x-A0.x)*(C0.y-A0.y) - (C0.x-A0.x)*(B0.y-A0.y));
      if(area < 1e-14) continue;
      const bcoef = [B0.y-C0.y, C0.y-A0.y, A0.y-B0.y];
      const ccoef = [C0.x-B0.x, A0.x-C0.x, B0.x-A0.x];
      const ids=[a,b,c];
      for(let i=0;i<3;i++){
        for(let j=0;j<3;j++){
          const val = (k/(4*area)) * (bcoef[i]*bcoef[j] + ccoef[i]*ccoef[j]);
          Kadd(ids[i], ids[j], val);
        }
      }
      if(Q !== 0){
        const load = Q*area/3;
        F[a]+=load; F[b]+=load; F[c]+=load;
      }
    }
  } else {
    for(const ids of elements){
      const coords = ids.map(i=>nodes[i]);
      const {Ke, Fe} = quadElementMatrices(coords, k, Q);
      for(let i=0;i<6;i++){
        for(let j=0;j<6;j++) Kadd(ids[i], ids[j], Ke[i*6+j]);
        F[ids[i]] += Fe[i];
      }
    }
  }

  // Neumann (flux) and Robin/convective boundary contributions — 2D edges only (1D handled above as point terms)
  if(!is1D){
    for(const edgeName of Object.keys(boundaries)){
      const bc = state.bc[edgeName];
      if(!bc || (bc.type !== 'flux' && bc.type !== 'convective')) continue;
      if(bc.type==='flux' && bc.value===0) continue;
      const list = boundaries[edgeName];
      const step = isQuadratic ? 2 : 1;
      for(let s=0;s+step<list.length;s+=step){
        if(isQuadratic){
          const p=list[s], m=list[s+1], q=list[s+2];
          const dx=nodes[q].x-nodes[p].x, dy=nodes[q].y-nodes[p].y;
          const len = Math.sqrt(dx*dx+dy*dy);
          if(bc.type==='flux'){
            F[p] += bc.value*len/6;
            F[m] += bc.value*len*4/6;
            F[q] += bc.value*len/6;
          } else {
            // Robin term: contributes to K (h*Ni*Nj integrated along the edge) and to F (h*Tinf*Ni)
            const sK = bc.h*len/30;
            const KL = [[4*sK,2*sK,-1*sK],[2*sK,16*sK,2*sK],[-1*sK,2*sK,4*sK]];
            const ids=[p,m,q];
            for(let i=0;i<3;i++) for(let j=0;j<3;j++) Kadd(ids[i],ids[j],KL[i][j]);
            F[p] += bc.h*bc.Tinf*len/6;
            F[m] += bc.h*bc.Tinf*len*4/6;
            F[q] += bc.h*bc.Tinf*len/6;
          }
        } else {
          const p=list[s], q=list[s+1];
          const dx=nodes[q].x-nodes[p].x, dy=nodes[q].y-nodes[p].y;
          const len = Math.sqrt(dx*dx+dy*dy);
          if(bc.type==='flux'){
            const contrib = bc.value*len/2;
            F[p]+=contrib; F[q]+=contrib;
          } else {
            const sK = bc.h*len/6;
            Kadd(p,p,2*sK); Kadd(p,q,1*sK); Kadd(q,p,1*sK); Kadd(q,q,2*sK);
            F[p] += bc.h*bc.Tinf*len/2;
            F[q] += bc.h*bc.Tinf*len/2;
          }
        }
      }
    }
  }

  const fixed = new Map();
  let hasConvective = false;
  for(const edgeName of Object.keys(boundaries)){
    const bc = state.bc[edgeName];
    if(!bc) continue;
    if(bc.type === 'fixed'){
      for(const nd of boundaries[edgeName]) fixed.set(nd, bc.value);
    } else if(bc.type === 'convective'){
      hasConvective = true;
    }
  }
  if(fixed.size === 0 && !hasConvective){
    throw new Error('ต้องกำหนดอุณหภูมิคงที่ (Fixed Temperature) หรือเงื่อนไขการพาความร้อน (Convective) อย่างน้อย 1 จุด/ขอบ เพื่อให้ระบบสมการแก้ได้');
  }

  return {K, F, n, fixed};
}

/* ---- Consistent mass matrix (for transient analysis): [C]{dT/dt} + [K]{T} = {F} ---- */
/* ---- Lumped (diagonal) mass matrix via HRZ lumping.
   Why lumped rather than the full "consistent" mass matrix: the consistent mass matrix is
   more accurate for smooth transients, but it is only *stable*, not *monotone* — right after a
   sudden Dirichlet jump it can produce small unphysical undershoots/overshoots that violate the
   maximum principle (temperature dipping below both the initial condition and every boundary
   value). Lumping trades a little accuracy for a scheme that respects physical bounds, which
   matters more for an educational tool. HRZ lumping (diagonal-scaling) is used instead of naive
   row-sum lumping because row sums of the quadratic-element consistent mass matrix are zero (or
   even change sign) at corner nodes — a known property of quadratic Lagrange shape functions —
   which would make a naive lumped matrix singular. HRZ keeps the (always positive) diagonal
   entries of the consistent matrix and rescales them so the element's total mass is preserved
   exactly; for linear elements this reduces to the standard textbook lumped mass. ---- */
function assembleMassMatrix(){
  const {nodes, elements} = state.mesh;
  const isQuadratic = state.mesh.order === 'quadratic';
  const is1D = state.mesh.dim === '1d';
  const n = nodes.length;
  const M = new Float64Array(n*n);
  const rhoC = state.material.rho * state.material.cp;
  function Madd(i,v){ M[i*n+i]+=v; }

  if(is1D){
    if(!isQuadratic){
      for(const [a,b] of elements){
        const Le = Math.abs(nodes[b].x-nodes[a].x);
        const total = rhoC*Le;
        Madd(a, total/2); Madd(b, total/2);
      }
    } else {
      for(const [a,m,b] of elements){
        const Le = Math.abs(nodes[b].x-nodes[a].x);
        const total = rhoC*Le;
        Madd(a, total/6); Madd(m, total*2/3); Madd(b, total/6);
      }
    }
  } else if(!isQuadratic){
    for(const [a,b,c] of elements){
      const A0=nodes[a], B0=nodes[b], C0=nodes[c];
      const area = 0.5*Math.abs((B0.x-A0.x)*(C0.y-A0.y) - (C0.x-A0.x)*(B0.y-A0.y));
      const total = rhoC*area;
      Madd(a, total/3); Madd(b, total/3); Madd(c, total/3);
    }
  } else {
    for(const ids of elements){
      const [P1,P2,P3] = ids.map(i=>nodes[i]);
      const area = 0.5*Math.abs((P2.x-P1.x)*(P3.y-P1.y) - (P3.x-P1.x)*(P2.y-P1.y));
      const total = rhoC*area;
      // HRZ fractions from the consistent T6 matrix's diagonal [6,6,6,32,32,32]/114
      const cornerFrac = 1/19, midFrac = 16/57;
      Madd(ids[0], total*cornerFrac); Madd(ids[1], total*cornerFrac); Madd(ids[2], total*cornerFrac);
      Madd(ids[3], total*midFrac);    Madd(ids[4], total*midFrac);    Madd(ids[5], total*midFrac);
    }
  }
  return M;
}

/* ---- Apply Dirichlet elimination to a (matrix, vector) pair in place ---- */
function eliminateDirichlet(A, b, n, fixed){
  for(const [i, Ti] of fixed.entries()){
    for(let j=0;j<n;j++){
      if(j===i) continue;
      b[j] -= A[j*n+i]*Ti;
      A[j*n+i]=0;
      A[i*n+j]=0;
    }
    b[i]=Ti;
    A[i*n+i]=1;
  }
}

function assembleSystem(){
  const {K, F, n, fixed} = assembleRawSystem();
  eliminateDirichlet(K, F, n, fixed);
  return {K, F, n};
}

/* ---- Linear solvers ---- */
function solveCG(K,F,n,x0){
  const T = new Float64Array(n);
  if(x0) T.set(x0);
  const r = new Float64Array(n);
  // r = F - K*T (accounts for a warm-start initial guess; r=F when T starts at zero)
  for(let i=0;i<n;i++){
    let s=0; const base=i*n;
    for(let j=0;j<n;j++) s+=K[base+j]*T[j];
    r[i]=F[i]-s;
  }
  const p = new Float64Array(r);
  let rsold=0;
  for(let i=0;i<n;i++) rsold += r[i]*r[i];
  const maxIter = Math.min(4000, n*3+50);
  let iters=0;
  const Ap = new Float64Array(n);
  if(Math.sqrt(rsold) >= 1e-9){
    for(iters=0; iters<maxIter; iters++){
      for(let i=0;i<n;i++){
        let s=0; const base=i*n;
        for(let j=0;j<n;j++) s+=K[base+j]*p[j];
        Ap[i]=s;
      }
      let pAp=0;
      for(let i=0;i<n;i++) pAp += p[i]*Ap[i];
      if(Math.abs(pAp) < 1e-18) break;
      const alpha = rsold/pAp;
      for(let i=0;i<n;i++){ T[i]+=alpha*p[i]; r[i]-=alpha*Ap[i]; }
      let rsnew=0;
      for(let i=0;i<n;i++) rsnew += r[i]*r[i];
      if(Math.sqrt(rsnew) < 1e-9) { iters++; break; }
      const beta = rsnew/rsold;
      for(let i=0;i<n;i++) p[i]=r[i]+beta*p[i];
      rsold=rsnew;
    }
  }
  return { T, iters, info:`Conjugate Gradient — ${iters} รอบวนซ้ำ` };
}

/* ---- Dense LU factorization with partial pivoting (reusable across many solves of the same matrix,
   which is exactly what a fixed-timestep transient simulation needs) ---- */
function luFactorize(Kin, n){
  const A = new Float64Array(n*n);
  A.set(Kin);
  const perm = new Int32Array(n);
  for(let i=0;i<n;i++) perm[i]=i;
  for(let col=0; col<n; col++){
    let maxRow=col, maxVal=Math.abs(A[col*n+col]);
    for(let r=col+1;r<n;r++){
      const v=Math.abs(A[r*n+col]);
      if(v>maxVal){ maxVal=v; maxRow=r; }
    }
    if(maxRow!==col){
      for(let c=0;c<n;c++){ const tmp=A[col*n+c]; A[col*n+c]=A[maxRow*n+c]; A[maxRow*n+c]=tmp; }
      const tmp=perm[col]; perm[col]=perm[maxRow]; perm[maxRow]=tmp;
    }
    const pivot = A[col*n+col];
    if(Math.abs(pivot) < 1e-13) continue;
    for(let r=col+1;r<n;r++){
      const factor = A[r*n+col]/pivot;
      A[r*n+col] = factor; // store the L multiplier in the (now eliminated) lower slot
      if(factor===0) continue;
      for(let c=col+1;c<n;c++) A[r*n+c] -= factor*A[col*n+c];
    }
  }
  return { LU:A, perm, n };
}
function luSolve(fac, bIn){
  const {LU, perm, n} = fac;
  const b = new Float64Array(n);
  for(let i=0;i<n;i++) b[i]=bIn[perm[i]];
  for(let i=1;i<n;i++){ let s=b[i]; for(let j=0;j<i;j++) s-=LU[i*n+j]*b[j]; b[i]=s; }
  const x = new Float64Array(n);
  for(let i=n-1;i>=0;i--){
    let s=b[i];
    for(let j=i+1;j<n;j++) s-=LU[i*n+j]*x[j];
    x[i] = s/LU[i*n+i];
  }
  return x;
}

function solveDirect(K,F,n){
  const fac = luFactorize(K,n);
  const T = luSolve(fac, F);
  return { T, iters:1, info:'Direct solve (LU decomposition with partial pivoting)' };
}

function solveLinearSystem(K,F,n,method){
  if(method==='direct') return solveDirect(K,F,n);
  return solveCG(K,F,n);
}

/* ---- Exact solution engine ---- */
function isZeroFlux(bc){ return !bc || bc.type==='insulated' || (bc.type==='flux' && bc.value===0); }

/* General 1D closed-form solver for T(x) = -(Q/2k)x^2 + C1*x + C2 with any mix of
   Fixed / Flux(or insulated) / Convective conditions at the two ends x=0 and x=L.
   Each end contributes one linear equation "a*C1 + b*C2 = c"; solving the 2x2 system
   handles every combination uniformly (including Robin/convective) without special-casing. */
function bcLinearEquation(end, bc, k, Q, L){
  if(bc.type==='fixed'){
    if(end==='left') return [0, 1, bc.value];
    return [L, 1, bc.value + (Q/(2*k))*L*L];
  }
  if(bc.type==='convective'){
    const h=bc.h, Tinf=bc.Tinf;
    if(end==='left') return [k, -h, -h*Tinf];
    return [k + h*L, h, Q*L + h*Q*L*L/(2*k) + h*Tinf];
  }
  // flux or insulated (insulated == flux with value 0)
  const q = bc.type==='flux' ? bc.value : 0;
  if(end==='left') return [1, 0, -q/k];
  return [1, 0, q/k + (Q/k)*L];
}

function exactSolution1D(L, k, Q, bcLo, bcHi){
  const [a1,b1,c1] = bcLinearEquation('left', bcLo, k, Q, L);
  const [a2,b2,c2] = bcLinearEquation('right', bcHi, k, Q, L);
  const det = a1*b2 - a2*b1;
  if(Math.abs(det) < 1e-10) return null; // ill-posed (e.g. both ends flux/insulated with no absolute reference)
  const C1 = (c1*b2 - c2*b1)/det;
  const C2 = (a1*c2 - a2*c1)/det;
  return (x)=> -(Q/(2*k))*x*x + C1*x + C2;
}

function stableSinhRatio(v, Lv, factor){
  if(v<=0) return 0;
  if(v>=Lv) return 1;
  const num = Math.exp(factor*(v-Lv)) * (1-Math.exp(-2*factor*v));
  const den = 1-Math.exp(-2*factor*Lv);
  return num/den;
}

function fourierRectangleSolution(x, y, W, H, Tleft, Tright, Ttop, Tbottom, nTerms){
  nTerms = nTerms || 60;
  function edgeContrib(u, v, Lu, Lv, Tval){
    if(Tval===0) return 0;
    let sum=0;
    for(let m=1; m<=nTerms; m++){
      const coeff = (1-Math.pow(-1,m))/m; // zero for even m
      if(coeff===0) continue;
      const factor = m*Math.PI/Lu;
      sum += coeff * Math.sin(m*Math.PI*u/Lu) * stableSinhRatio(v, Lv, factor);
    }
    return (2*Tval/Math.PI)*sum;
  }
  const top    = edgeContrib(x, y, W, H, Ttop);
  const bottom = edgeContrib(x, H-y, W, H, Tbottom);
  const right  = edgeContrib(y, x, H, W, Tright);
  const left   = edgeContrib(y, W-x, H, W, Tleft);
  return top+bottom+right+left;
}

function computeExactSolution(){
  const mesh = state.mesh;
  const k = state.material.k, Q = state.material.Q;

  if(state.dimension==='1d'){
    const f = exactSolution1D(state.geom.length, k, Q, state.bc.left, state.bc.right);
    if(!f) return { available:false, note:'ไม่สามารถหา exact solution ได้ (เงื่อนไขขอบเขตไม่เพียงพอ)' };
    const T = mesh.nodes.map(nd=>f(nd.x));
    return { available:true, T, method:'1D closed-form solution', note:'คำตอบปิดของสมการ 1D: T(x) = −(Q/2k)x² + C₁x + C₂ โดยหาค่าคงที่ C₁, C₂ จากเงื่อนไขขอบเขตทั้งสองด้าน' };
  }

  // trivial case: every boundary edge fixed to the SAME temperature and no internal heat source —
  // by uniqueness of the Laplace equation this applies to ANY 2D shape, so check it before the
  // shape-specific logic below.
  {
    const bcs = Object.values(state.bc);
    const allFixed = bcs.length>0 && bcs.every(b=> b.type==='fixed');
    if(allFixed && Q===0){
      const vals = bcs.map(b=>b.value);
      const same = vals.every(v=> Math.abs(v-vals[0]) < 1e-9);
      if(same){
        const T = mesh.nodes.map(()=> vals[0]);
        return { available:true, T, method:'คำตอบคงที่ (trivial)', note:'ทุกขอบกำหนดอุณหภูมิเท่ากันและไม่มีแหล่งความร้อนภายใน อุณหภูมิจึงคงที่เท่ากันทั่วทั้งโมเดลตามหลัก uniqueness ของสมการ Laplace' };
      }
    }
  }

  if(state.shape==='rectangle'){
    const W = state.geom.width, H = state.geom.height;
    const topIns=isZeroFlux(state.bc.top), botIns=isZeroFlux(state.bc.bottom);
    const leftIns=isZeroFlux(state.bc.left), rightIns=isZeroFlux(state.bc.right);

    if(topIns && botIns){
      const f = exactSolution1D(W, k, Q, state.bc.left, state.bc.right);
      if(f){
        const T = mesh.nodes.map(nd=>f(nd.x));
        return { available:true, T, method:'ลดรูปเป็น 1D ตามแกน x', note:'ขอบบนและขอบล่างเป็น insulated ทำให้ผลเฉลยไม่ขึ้นกับ y จึงลดรูปเหลือสมการ 1D ตามแกน x ที่มีคำตอบปิดเหมือนโมเดล 1D' };
      }
    }
    if(leftIns && rightIns){
      const f = exactSolution1D(H, k, Q, state.bc.bottom, state.bc.top);
      if(f){
        const T = mesh.nodes.map(nd=>f(nd.y));
        return { available:true, T, method:'ลดรูปเป็น 1D ตามแกน y', note:'ขอบซ้ายและขอบขวาเป็น insulated ทำให้ผลเฉลยไม่ขึ้นกับ x จึงลดรูปเหลือสมการ 1D ตามแกน y ที่มีคำตอบปิดเหมือนโมเดล 1D' };
      }
    }
    const allFixed4 = ['left','right','top','bottom'].every(e=> state.bc[e] && state.bc[e].type==='fixed');
    if(allFixed4 && Q===0){
      const T = mesh.nodes.map(nd=> fourierRectangleSolution(nd.x, nd.y, W, H,
        state.bc.left.value, state.bc.right.value, state.bc.top.value, state.bc.bottom.value, 60));
      return { available:true, T, method:'Fourier series (superposition, 60 พจน์)', excludeBoundaryFromError:true,
        note:'คำตอบอนุกรมฟูริเยร์ของสมการ Laplace สำหรับกรณี Dirichlet ครบทั้ง 4 ขอบ (Q=0) — ที่มุมและใกล้ขอบ ค่าจากอนุกรมจะมีความคลาดเคลื่อนโดยธรรมชาติจาก Gibbs phenomenon/corner singularity (เป็นคุณสมบัติทางคณิตศาสตร์ของวิธีนี้ ไม่ใช่ข้อผิดพลาดของ FEM) ค่า error ที่แสดงจึงคำนวณเฉพาะโหนดภายในโมเดลเพื่อให้เห็นความแม่นยำที่แท้จริง' };
    }
    if(Q!==0){
      return { available:false, note:'ไม่มีสูตรคำตอบปิดสำหรับกรณีนี้ เนื่องจากมีทั้งแหล่งกำเนิดความร้อนภายใน (Q≠0) และเงื่อนไขขอบเขตที่ไม่ลดรูปเป็น 1 มิติได้' };
    }
    return { available:false, note:'ไม่มีสูตรคำตอบปิดสำหรับเงื่อนไขขอบเขตแบบผสม (Dirichlet+Neumann/flux) ในทิศทางที่ไม่ลดรูปเป็น 1 มิติได้ — รองรับเฉพาะกรณี Dirichlet ครบ 4 ขอบ หรือกรณีลดรูปเป็น 1D' };
  }

  // custom polygon: no general closed form (handled by the trivial-case check above when it applies)
  return { available:false, note:'รูปทรงที่วาดเองไม่มีสูตรคำตอบปิดทั่วไป ยกเว้นกรณีพิเศษที่ทุกขอบมีอุณหภูมิเท่ากันและไม่มีแหล่งความร้อนภายใน (Q=0)' };
}

/* ---- Top-level solve entry point ---- */
function solveHeatConduction(){
  const {K, F, n} = assembleSystem();
  const { T, iters, info } = solveLinearSystem(K, F, n, state.solverMethod);

  let min=Infinity, max=-Infinity;
  for(let i=0;i<n;i++){ if(T[i]<min)min=T[i]; if(T[i]>max)max=T[i]; }

  const exact = computeExactSolution();
  if(exact.available){
    let excludeSet = null;
    if(exact.excludeBoundaryFromError){
      excludeSet = new Set();
      Object.values(state.mesh.boundaries).forEach(list=> list.forEach(i=> excludeSet.add(i)));
    }
    let sumSq=0, maxErr=0, cnt=0;
    for(let i=0;i<n;i++){
      if(excludeSet && excludeSet.has(i)) continue;
      const e = Math.abs(T[i]-exact.T[i]);
      sumSq += e*e; cnt++;
      if(e>maxErr) maxErr=e;
    }
    exact.maxErr = maxErr;
    exact.rmsErr = Math.sqrt(sumSq/Math.max(1,cnt));
    exact.statsExcludeBoundary = !!excludeSet;
  }

  state.results = { T, min, max, iters, info, dof:n, exact, transient:false };
}

/* ---- Transient (time-dependent) solve: [M]{dT/dt} + [K]{T} = {F}, BC and Q held constant in time ---- */
function solveTransientHeatConduction(){
  const {K, F, n, fixed} = assembleRawSystem();
  const M = assembleMassMatrix();

  const totalTime = state.transient.totalTime;
  const steps = Math.max(1, Math.min(300, Math.round(state.transient.steps)));
  const dt = totalTime/steps;

  const Araw = new Float64Array(n*n);
  for(let idx=0; idx<n*n; idx++) Araw[idx] = M[idx] + dt*K[idx];

  const dirichletCorrection = new Float64Array(n);
  for(const [i, Ti] of fixed.entries()){
    for(let j=0;j<n;j++) dirichletCorrection[j] += Araw[j*n+i]*Ti;
  }

  const Abc = new Float64Array(Araw);
  for(const [i] of fixed.entries()){
    for(let j=0;j<n;j++){
      if(j===i) continue;
      Abc[j*n+i]=0;
      Abc[i*n+j]=0;
    }
    Abc[i*n+i]=1;
  }

  let T = new Float64Array(n).fill(state.transient.T0);
  for(const [i,Ti] of fixed.entries()) T[i]=Ti;

  const timeSeries = [{t:0, T:T.slice()}];

  const useDirect = state.solverMethod==='direct';
  const factorization = useDirect ? luFactorize(Abc, n) : null;

  for(let step=1; step<=steps; step++){
    const rawB = new Float64Array(n);
    for(let i=0;i<n;i++){
      let s=0; const base=i*n;
      for(let j=0;j<n;j++) s += M[base+j]*T[j];
      rawB[i] = s + dt*F[i];
    }
    const bBc = new Float64Array(n);
    for(let j=0;j<n;j++) bBc[j] = rawB[j] - dirichletCorrection[j];
    for(const [i,Ti] of fixed.entries()) bBc[i]=Ti;

    const Tnext = useDirect ? luSolve(factorization, bBc) : solveCG(Abc, bBc, n, T).T;
    T = Tnext;
    timeSeries.push({t: step*dt, T: T.slice()});
  }

  let min=Infinity, max=-Infinity;
  for(const snap of timeSeries) for(const v of snap.T){ if(v<min) min=v; if(v>max) max=v; }

  const methodLabel = useDirect ? 'Direct (LU decomposition, factorized once and reused every step)' : 'Conjugate Gradient (warm-started from the previous time step)';
  state.results = {
    transient: true,
    timeSeries, min, max, dt, steps, dof:n,
    info: `Backward Euler time-stepping — ${steps} steps, Δt = ${dt.toFixed(4)} s — solved with ${methodLabel}`,
    exact: { available:false, note:'ยังไม่รองรับการเปรียบเทียบ exact solution สำหรับการวิเคราะห์แบบ transient ในเวอร์ชันนี้ (รองรับเฉพาะ steady-state)' },
  };
}

/* ============================= COLOR MAP (smooth rainbow gradient) ============================= */
function hslToRgb01(h, s, l){
  h = ((h%360)+360)%360;
  const c = (1-Math.abs(2*l-1))*s;
  const x = c*(1-Math.abs((h/60)%2-1));
  const m = l-c/2;
  let r,g,b;
  if(h<60){ r=c;g=x;b=0; } else if(h<120){ r=x;g=c;b=0; }
  else if(h<180){ r=0;g=c;b=x; } else if(h<240){ r=0;g=x;b=c; }
  else if(h<300){ r=x;g=0;b=c; } else { r=c;g=0;b=x; }
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
function rainbowColorRGB(t){
  t = Math.max(0, Math.min(1, t));
  const hue = 240*(1-t); // 240=blue (low) -> 0=red (high)
  return hslToRgb01(hue, 1, 0.5);
}
function rainbowColor(t){
  const [r,g,b] = rainbowColorRGB(t);
  return `rgb(${r},${g},${b})`;
}

/* ---- True per-pixel (Gouraud-style) smooth gradient contour fill ---- */
function fillContourGradient(canvas, mesh, T, min, max, tf){
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const img = ctx.createImageData(W, H);
  const data = img.data;
  for(let i=0;i<data.length;i+=4){ data[i]=255; data[i+1]=255; data[i+2]=255; data[i+3]=255; }
  const range = (max-min) || 1;

  for(const [a,b,c] of getRenderTriangles(mesh)){
    const A=mesh.nodes[a], B=mesh.nodes[b], C=mesh.nodes[c];
    const [ax,ay]=tf(A.x,A.y), [bx,by]=tf(B.x,B.y), [cx,cy]=tf(C.x,C.y);
    const denom = (by-cy)*(ax-cx) + (cx-bx)*(ay-cy);
    if(Math.abs(denom) < 1e-10) continue;
    const minX = Math.max(0, Math.floor(Math.min(ax,bx,cx)));
    const maxX = Math.min(W-1, Math.ceil(Math.max(ax,bx,cx)));
    const minY = Math.max(0, Math.floor(Math.min(ay,by,cy)));
    const maxY = Math.min(H-1, Math.ceil(Math.max(ay,by,cy)));
    const Ta=T[a], Tb=T[b], Tc=T[c];
    const eps = -0.002;
    for(let py=minY; py<=maxY; py++){
      for(let px=minX; px<=maxX; px++){
        const fx=px+0.5, fy=py+0.5;
        const w1 = ((by-cy)*(fx-cx) + (cx-bx)*(fy-cy)) / denom;
        const w2 = ((cy-ay)*(fx-cx) + (ax-cx)*(fy-cy)) / denom;
        const w3 = 1-w1-w2;
        if(w1>=eps && w2>=eps && w3>=eps){
          const val = w1*Ta + w2*Tb + w3*Tc;
          const [r,g,bl] = rainbowColorRGB((val-min)/range);
          const idx = (py*W+px)*4;
          data[idx]=r; data[idx+1]=g; data[idx+2]=bl; data[idx+3]=255;
        }
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

/* ============================= RENDERING ============================= */
function fitTransform(bbox, canvasW, canvasH, pad){
  const availW = canvasW - 2*pad, availH = canvasH - 2*pad;
  const scale = Math.min(availW/bbox.w, availH/bbox.h);
  const offX = pad + (availW - bbox.w*scale)/2;
  const offY = pad + (availH - bbox.h*scale)/2;
  return (x,y)=> [offX + x*scale, canvasH - (offY + y*scale)];
}

function getRenderTriangles(mesh){
  if(mesh.order === 'quadratic'){
    const tris = [];
    for(const [a,b,c,m1,m2,m3] of mesh.elements){
      tris.push([a,m1,m3],[m1,b,m2],[m3,m2,c],[m1,m2,m3]);
    }
    return tris;
  }
  return mesh.elements;
}

function drawMeshCanvas(canvas, mesh, showResults, overrideData){
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  const tf = fitTransform(mesh.bbox, W, H, 26);
  const T = overrideData ? overrideData.T : (showResults && state.results ? state.results.T : null);
  const min = overrideData ? overrideData.min : (T ? state.results.min : 0);
  const max = overrideData ? overrideData.max : (T ? state.results.max : 1);

  if(T){
    fillContourGradient(canvas, mesh, T, min, max, tf);
  } else {
    for(const [a,b,c] of getRenderTriangles(mesh)){
      const A=mesh.nodes[a], B=mesh.nodes[b], C=mesh.nodes[c];
      const [ax,ay]=tf(A.x,A.y), [bx,by]=tf(B.x,B.y), [cx,cy]=tf(C.x,C.y);
      ctx.beginPath();
      ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.lineTo(cx,cy); ctx.closePath();
      ctx.fillStyle = '#EEF3F1';
      ctx.fill();
      ctx.strokeStyle = 'rgba(58,65,69,0.35)';
      ctx.lineWidth = 0.6;
      ctx.stroke();
    }
  }

  // boundary highlight (only in bc step, drawn separately) — outline shape
  ctx.strokeStyle = '#3A4145';
  ctx.lineWidth = 1.4;
  drawOutline(ctx, mesh, tf);
}

function drawOutline(ctx, mesh, tf){
  let loop = [];
  if(mesh.boundaries.left && mesh.boundaries.top){
    const {left,right,bottom,top} = mesh.boundaries;
    loop = [...bottom, ...right.slice(1), ...[...top].reverse().slice(1), ...[...left].reverse().slice(1)];
  } else if(mesh.boundaries.base){
    const {base, hyp, side} = mesh.boundaries;
    loop = [...base, ...hyp.slice(1), ...[...side].reverse().slice(1)];
  } else {
    // single continuous boundary loop (e.g. circle) — already closed
    loop = mesh.boundaries[Object.keys(mesh.boundaries)[0]];
  }
  ctx.beginPath();
  loop.forEach((nd,i)=>{
    const [x,y]=tf(mesh.nodes[nd].x, mesh.nodes[nd].y);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.stroke();
}

function highlightEdge(ctx, mesh, tf, edgeName, color){
  const list = mesh.boundaries[edgeName];
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.beginPath();
  list.forEach((nd,i)=>{
    const [x,y]=tf(mesh.nodes[nd].x, mesh.nodes[nd].y);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
}

/* ---- 1D rendering helpers ---- */
function draw1DDomain(canvas, length, opts){
  opts = opts || {};
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  const pad = 40;
  const y0 = H/2;
  const x0 = pad, x1 = W-pad;
  ctx.strokeStyle = '#3A4145'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y0); ctx.stroke();
  // end caps
  ctx.beginPath(); ctx.moveTo(x0,y0-10); ctx.lineTo(x0,y0+10); ctx.moveTo(x1,y0-10); ctx.lineTo(x1,y0+10); ctx.stroke();
  ctx.fillStyle = '#7C8588'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('x = 0', x0, y0+26);
  ctx.fillText(`x = L = ${length} m`, x1, y0+26);
  if(opts.highlight){
    ctx.strokeStyle = '#D9A441'; ctx.lineWidth=5;
    const hx = opts.highlight==='left' ? x0 : x1;
    ctx.beginPath(); ctx.moveTo(hx,y0-14); ctx.lineTo(hx,y0+14); ctx.stroke();
  }
  return {x0,x1,y0};
}

function draw1DMesh(canvas, mesh){
  const {x0,x1,y0} = draw1DDomain(canvas, mesh.bbox.w);
  const ctx = canvas.getContext('2d');
  const scale = (x1-x0)/mesh.bbox.w;
  const isQuad = mesh.order==='quadratic';
  for(const el of mesh.elements){
    const corners = isQuad ? [el[0], el[2]] : [el[0], el[1]];
    corners.forEach(ci=>{
      const px = x0 + mesh.nodes[ci].x*scale;
      ctx.beginPath(); ctx.arc(px,y0,5,0,Math.PI*2); ctx.fillStyle='#3FAE8C'; ctx.fill();
    });
    if(isQuad){
      const px = x0 + mesh.nodes[el[1]].x*scale;
      ctx.beginPath(); ctx.arc(px,y0,5,0,Math.PI*2); ctx.fillStyle='#D9A441'; ctx.fill();
    }
  }
}

function draw1DResultsChart(canvas, mesh, T, exactT){
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  const padL=50, padR=20, padT=20, padB=40;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  let tmin=Infinity, tmax=-Infinity;
  for(const v of T){ if(v<tmin)tmin=v; if(v>tmax)tmax=v; }
  if(exactT) for(const v of exactT){ if(v<tmin)tmin=v; if(v>tmax)tmax=v; }
  if(tmax-tmin < 1e-9){ tmax+=0.5; tmin-=0.5; }
  const L = mesh.bbox.w;
  const xToPx = x => padL + (x/L)*plotW;
  const tToPx = t => padT + plotH - ((t-tmin)/(tmax-tmin))*plotH;

  // axes
  ctx.strokeStyle = '#D3DAD9'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(padL,padT); ctx.lineTo(padL,padT+plotH); ctx.lineTo(padL+plotW,padT+plotH); ctx.stroke();
  ctx.fillStyle='#7C8588'; ctx.font='11px sans-serif'; ctx.textAlign='right';
  ctx.fillText(tmax.toFixed(1), padL-6, tToPx(tmax)+4);
  ctx.fillText(tmin.toFixed(1), padL-6, tToPx(tmin)+4);
  ctx.textAlign='center';
  ctx.fillText('0', xToPx(0), padT+plotH+16);
  ctx.fillText(L.toFixed(2)+' m', xToPx(L), padT+plotH+16);

  // node x-coordinates for numeric solution: use corner nodes only, sorted by x
  const cornerIdx = [];
  for(let i=0;i<mesh.nodes.length;i++){
    if(mesh.order==='quadratic'){
      // corners are nodes referenced as element[0]/element[2]; simplest: mark all, we will sort & dedupe by x
    }
  }
  const pts = mesh.nodes.map((nd,i)=>({x:nd.x, t:T[i]})).sort((a,b)=>a.x-b.x);

  if(exactT){
    const exPts = mesh.nodes.map((nd,i)=>({x:nd.x, t:exactT[i]})).sort((a,b)=>a.x-b.x);
    ctx.strokeStyle = '#D9A441'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    ctx.beginPath();
    exPts.forEach((p,i)=>{ const px=xToPx(p.x), py=tToPx(p.t); if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); });
    ctx.stroke(); ctx.setLineDash([]);
  }

  ctx.strokeStyle = '#3FAE8C'; ctx.lineWidth=2.5;
  ctx.beginPath();
  pts.forEach((p,i)=>{ const px=xToPx(p.x), py=tToPx(p.t); if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); });
  ctx.stroke();
  ctx.fillStyle='#3FAE8C';
  pts.forEach(p=>{ ctx.beginPath(); ctx.arc(xToPx(p.x), tToPx(p.t), 3, 0, Math.PI*2); ctx.fill(); });

  // legend
  ctx.textAlign='left';
  ctx.fillStyle='#3FAE8C'; ctx.fillRect(padL+plotW-150, padT+4, 14, 3);
  ctx.fillStyle='#3A4145'; ctx.font='11px sans-serif'; ctx.fillText('Numerical (FEM)', padL+plotW-130, padT+9);
  if(exactT){
    ctx.strokeStyle='#D9A441'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    ctx.beginPath(); ctx.moveTo(padL+plotW-150, padT+22); ctx.lineTo(padL+plotW-136, padT+22); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#3A4145'; ctx.fillText('Exact solution', padL+plotW-130, padT+26);
  }
}

  STEPS.forEach((s, i)=>{
    const div = document.createElement('div');
    const locked = i > maxReachableStep();
    div.className = 'step-item' + (i===state.step?' active':'') + (i<state.step?' done':'') + (locked?' locked':'');
    div.innerHTML = `<span class="n">${i+1}</span><span>${s.label}</span>`;
    if(!locked){
      div.addEventListener('click', ()=>{ state.step=i; renderAll(); });
    }
    nav.appendChild(div);
  });
}

function maxReachableStep(){
  // equation, geometry, material, bc, and mesh steps have no hard prerequisite —
  // mesh generation itself happens inside the mesh step, so it must always be reachable.
  let m = 4;
  if(state.mesh) m = Math.max(m, 5); // solve step unlocks once a mesh exists
  return m;
}

function renderAll(){
  renderNav();
  renderMain();
  renderInfo();
}

let playbackTimer = null;
function stopPlayback(){ if(playbackTimer){ clearInterval(playbackTimer); playbackTimer=null; } }

function renderMain(){
  stopPlayback(); // any full re-render replaces the DOM, so kill any timer referencing old elements
  const main = document.getElementById('mainPanel');
  main.innerHTML = '';
  const key = STEPS[state.step].key;
  if(key==='equation') renderEquationStep(main);
  else if(key==='geometry') renderGeometryStep(main);
  else if(key==='material') renderMaterialStep(main);
  else if(key==='mesh') renderMeshStep(main);
  else if(key==='bc') renderBcStep(main);
  else if(key==='solve') renderSolveStep(main);
}

function makeTitle(main, title, desc){
  const h = document.createElement('h2'); h.className='panel-title'; h.textContent=title;
  const p = document.createElement('p'); p.className='panel-desc'; p.textContent=desc;
  main.appendChild(h); main.appendChild(p);
}

function navButtons(main, {back, next, nextLabel, onNext, nextDisabled}){
  const div = document.createElement('div'); div.className='actions';
  if(back){
    const b = document.createElement('button'); b.className='secondary'; b.textContent='← ย้อนกลับ';
    b.onclick = ()=>{ state.step--; renderAll(); };
    div.appendChild(b);
  }
  if(next){
    const n = document.createElement('button'); n.className='primary'; n.textContent = nextLabel || 'ถัดไป →';
    n.disabled = !!nextDisabled;
    n.onclick = onNext;
    div.appendChild(n);
  }
  main.appendChild(div);
}

/* --- Step 1: Equation --- */
function renderEquationStep(main){
  makeTitle(main, 'เลือกสมการที่ใช้จำลอง', 'เวอร์ชันนี้รองรับการถ่ายเทความร้อน (heat transfer) ทั้งแบบคงตัว (steady-state) และแบบไม่คงตัวตามเวลา (transient)');
  const wrap = document.createElement('div'); wrap.className='eq-choice';
  const opts = [
    {id:'heat', label:'Heat Transfer', tag:'พร้อมใช้งาน', enabled:true},
    {id:'structure', label:'Structural (elastic)', tag:'coming soon', enabled:false},
  ];
  opts.forEach(o=>{
    const b = document.createElement('div');
    b.className = 'eq-btn' + (state.equation===o.id?' sel':'') + (!o.enabled?' disabled':'');
    b.innerHTML = `${o.label}<span class="tag">${o.tag}</span>`;
    if(o.enabled) b.onclick = ()=>{ state.equation=o.id; renderAll(); };
    wrap.appendChild(b);
  });
  main.appendChild(wrap);

  const wrap2 = document.createElement('div'); wrap2.className='eq-choice';
  const opts2 = [
    {id:'steady', label:'Steady state', enabled:true},
    {id:'transient', label:'Time-dependent (transient)', enabled:true},
  ];
  opts2.forEach(o=>{
    const b = document.createElement('div');
    b.className = 'eq-btn' + (state.analysisType===o.id?' sel':'') + (!o.enabled?' disabled':'');
    b.innerHTML = `${o.label}${!o.enabled?'<span class="tag">coming soon</span>':''}`;
    if(o.enabled) b.onclick = ()=>{ state.analysisType=o.id; state.results=null; renderAll(); };
    wrap2.appendChild(b);
  });
  main.appendChild(wrap2);

  if(state.analysisType==='steady'){
    eqBlock(main, 'Governing equation (steady-state heat conduction)',
      GOVERNING_EQ_GENERAL,
      `เมื่อ <b>T</b> คืออุณหภูมิ, <b>k</b> คือสัมประสิทธิ์การนำความร้อนของวัสดุ, <b>Q</b> คือแหล่งกำเนิดความร้อนภายในเนื้อวัสดุ (ต่อหน่วยปริมาตร)<br>
      สำหรับวัสดุที่มีค่า k คงที่ สมการนี้เขียนแบบขยายได้เป็น:`
    );
    const box2 = document.createElement('div'); box2.className='eq-block';
    const eq2 = document.createElement('div'); eq2.className='equation'; eq2.innerHTML = GOVERNING_EQ_EXPANDED;
    box2.appendChild(eq2);
    main.appendChild(box2);
  } else {
    eqBlock(main, 'Governing equation (transient heat conduction)',
      GOVERNING_EQ_TRANSIENT_GENERAL,
      `เมื่อ <b>T</b> คืออุณหภูมิ (เปลี่ยนแปลงตามเวลา), <b>ρc</b> คือความจุความร้อนต่อปริมาตร (volumetric heat capacity), <b>k</b> คือสัมประสิทธิ์การนำความร้อน, <b>Q</b> คือแหล่งกำเนิดความร้อนภายใน (สมมติคงที่ตามเวลา)<br>
      สำหรับวัสดุที่มีค่า k คงที่ สมการนี้เขียนแบบขยายได้เป็น:`
    );
    const box2 = document.createElement('div'); box2.className='eq-block';
    const eq2 = document.createElement('div'); eq2.className='equation'; eq2.innerHTML = GOVERNING_EQ_TRANSIENT_EXPANDED;
    box2.appendChild(eq2);
    main.appendChild(box2);
    const note = document.createElement('div'); note.className='eq-note';
    note.textContent = 'ระบบจะแปลงสมการนี้เป็นระบบ [M]{dT/dt}+[K]{T}={F} ด้วยไฟไนต์เอลิเมนต์ แล้วเดินเวลาด้วยวิธี Backward Euler (implicit, เสถียรไม่มีเงื่อนไข) — เงื่อนไขขอบเขตและ Q สมมติว่าคงที่ตลอดช่วงเวลาที่จำลอง';
    main.appendChild(note);
  }

}

/* --- Step 2: Geometry --- */
const DRAW_SCALE = 80; // pixels per meter for the freeform drawing canvas
const DRAW_GRID_SPACING = 0.5; // meters between grid lines
const DRAW_SNAP = 0.05; // meters — clicked points snap to this grid

function renderGeometryStep(main){
  makeTitle(main, 'สร้างรูปทรงโมเดล', 'เลือกมิติของโมเดล และเลือกรูปทรงจากเทมเพลตสำเร็จรูป หรือวาดรูปร่างเองแล้วกำหนดขนาดเป็นตัวเลข (หน่วยเมตร)');

  dim1D.onclick = ()=>{ state.dimension='1d'; state.shape='line'; state.mesh=null; state.results=null; renderAll(); };
  const dim2D = document.createElement('div');

  dim2D.innerHTML = `2D — พื้นที่ระนาบ<span class="tag">สี่เหลี่ยม/วาดเอง</span>`;
  dim2D.onclick = ()=>{ state.dimension='2d'; if(state.shape==='line') state.shape='rectangle'; state.mesh=null; state.results=null; renderAll(); };

  main.appendChild(dimRow);

  if(state.dimension==='1d'){
    const row = document.createElement('div'); row.className='field-row';
    row.appendChild(numField('ความยาวของเส้น/แท่ง (length)', state.geom.length, 'm', v=>{state.geom.length=v; state.mesh=null; state.results=null;}));
    main.appendChild(row);
    const note = document.createElement('div'); note.className='eq-note';
    note.textContent = 'สมมติพื้นที่หน้าตัด A = 1 m² เพื่อความง่าย (ไม่ส่งผลต่อรูปแบบคำตอบของอุณหภูมิ)';
    main.appendChild(note);

  rectBtn.onclick = ()=>{ state.shape='rectangle'; state.mesh=null; state.results=null; renderAll(); };
  const polyBtn = document.createElement('div');
  polyBtn.className='shape-btn'+(state.shape==='polygon'?' sel':'');
  polyBtn.innerHTML = `<svg viewBox="0 0 40 40"><polygon points="4,30 14,6 32,10 36,26 20,36" fill="none" stroke="${state.shape==='polygon'?'#3FAE8C':'#7C8588'}" stroke-width="2"/></svg><span>วาดรูปร่างเอง</span>`;
  polyBtn.onclick = ()=>{ state.shape='polygon'; state.mesh=null; state.results=null; renderAll(); };
  shapes.appendChild(rectBtn); shapes.appendChild(polyBtn);
  main.appendChild(shapes);

  if(state.shape==='rectangle'){
    const row = document.createElement('div'); row.className='field-row';
    row.appendChild(numField('ความกว้าง (width)', state.geom.width, 'm', v=>{state.geom.width=v; state.mesh=null; state.results=null;}));
    row.appendChild(numField('ความสูง (height)', state.geom.height, 'm', v=>{state.geom.height=v; state.mesh=null; state.results=null;}));
    main.appendChild(row);

    const wrap = document.createElement('div'); wrap.className='canvas-wrap';

    wrap.appendChild(cv);

function renderPolygonDrawTool(main){
  const p = state.polygon;

  if(!p.finalized){
    const desc = document.createElement('p'); desc.className='panel-desc';
    desc.textContent = `คลิกบนตารางเพื่อวางจุดต่อเนื่องกันเป็นเส้นตรง (พื้นที่วาดสูงสุด ${(460/DRAW_SCALE).toFixed(1)} × ${(340/DRAW_SCALE).toFixed(1)} ม., จุดจะสแนปเข้าตาราง ${DRAW_SNAP} ม.) เมื่อวางครบแล้วกด "ปิดรูปร่าง" เพื่อเชื่อมจุดสุดท้ายกลับไปยังจุดแรก`;
    main.appendChild(desc);

    const wrap = document.createElement('div'); wrap.className='canvas-wrap';
    const cv = document.createElement('canvas'); cv.width=460; cv.height=340; cv.style.cursor='crosshair';
    wrap.appendChild(cv);
    main.appendChild(wrap);

    const errDiv = document.createElement('div'); errDiv.className='error';
    main.appendChild(errDiv);

    cv.addEventListener('click', (e)=>{
      const rect = cv.getBoundingClientRect();
      const px = e.clientX-rect.left, py = e.clientY-rect.top;
      let x = Math.round((px/DRAW_SCALE)/DRAW_SNAP)*DRAW_SNAP;
      let y = Math.round(((cv.height-py)/DRAW_SCALE)/DRAW_SNAP)*DRAW_SNAP;
      x = Math.max(0, x); y = Math.max(0, y);
      p.vertices.push({x,y});
      renderMain();
    });

    const actions = document.createElement('div'); actions.className='actions';
    const undoBtn = document.createElement('button'); undoBtn.className='secondary'; undoBtn.textContent='↩ ยกเลิกจุดล่าสุด';
    undoBtn.disabled = p.vertices.length===0;
    undoBtn.onclick = ()=>{ p.vertices.pop(); renderMain(); };
    const clearBtn = document.createElement('button'); clearBtn.className='secondary'; clearBtn.textContent='ล้างทั้งหมด';
    clearBtn.disabled = p.vertices.length===0;
    clearBtn.onclick = ()=>{ p.vertices=[]; renderMain(); };
    const closeBtn = document.createElement('button'); closeBtn.className='primary'; closeBtn.textContent='ปิดรูปร่าง';
    closeBtn.disabled = p.vertices.length<3;
    closeBtn.onclick = ()=>{
      if(!isSimplePolygon(p.vertices)){
        errDiv.textContent = 'รูปร่างที่วาดมีเส้นตัดกันเอง กรุณายกเลิกจุดล่าสุดหรือล้างแล้ววาดใหม่';
        errDiv.style.display='block';
        return;
      }
      let minX=Infinity, minY=Infinity;
      p.vertices.forEach(v=>{ if(v.x<minX) minX=v.x; if(v.y<minY) minY=v.y; });
      p.vertices = p.vertices.map(v=>({x:v.x-minX, y:v.y-minY}));
      p.finalized = true;
      state.mesh=null; state.results=null; state.bc={};
      renderAll();
    };
    actions.appendChild(undoBtn); actions.appendChild(clearBtn); actions.appendChild(closeBtn);
    main.appendChild(actions);

    const info = document.createElement('div'); info.className='eq-note'; info.style.marginTop='10px';
    info.textContent = `จำนวนจุดที่วางแล้ว: ${p.vertices.length}`;
    main.appendChild(info);

    drawPolygonDraftCanvas(cv);
    navButtons(main, { back:true, next:false });
  } else {
    const bbox = bboxFor2DShape();
    const summary = document.createElement('div'); summary.className='eq-block'; summary.style.background='#fff'; summary.style.borderColor='var(--border-strong)';
    summary.innerHTML = `<div class="eq-caption" style="margin-bottom:10px;">รูปร่างที่วาด</div>
      <div style="display:flex; gap:32px; font-family:var(--mono);">
        <div><div class="unit">จำนวนจุด/ขอบ</div><div style="font-size:20px; font-weight:700; color:var(--mint-deep);">${state.polygon.vertices.length}</div></div>
        <div><div class="unit">ขนาดกรอบ (bounding box)</div><div style="font-size:20px; font-weight:700; color:var(--mint-deep);">${bbox.w.toFixed(2)} × ${bbox.h.toFixed(2)} m</div></div>
      </div>`;
    main.appendChild(summary);

    const wrap = document.createElement('div'); wrap.className='canvas-wrap';
    const cv = document.createElement('canvas'); cv.width=460; cv.height=300;
    wrap.appendChild(cv);
    main.appendChild(wrap);
    drawPreviewShape(cv);

    const redrawBtn = document.createElement('button'); redrawBtn.className='secondary'; redrawBtn.style.marginTop='12px'; redrawBtn.textContent='✎ วาดรูปร่างใหม่';
    redrawBtn.onclick = ()=>{ state.polygon={vertices:[], finalized:false}; state.mesh=null; state.results=null; state.bc={}; renderAll(); };
    main.appendChild(redrawBtn);

    navButtons(main, { back:true, next:true, onNext:()=>{ state.step=2; renderAll(); } });
  }
}

function drawPolygonDraftCanvas(cv){
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='rgba(58,65,69,0.08)'; ctx.lineWidth=1;
  const stepPx = DRAW_GRID_SPACING*DRAW_SCALE;
  for(let x=0;x<=cv.width;x+=stepPx){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,cv.height); ctx.stroke(); }
  for(let y=0;y<=cv.height;y+=stepPx){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(cv.width,y); ctx.stroke(); }

  const verts = state.polygon.vertices;
  const toPx = (v)=> [v.x*DRAW_SCALE, cv.height - v.y*DRAW_SCALE];
  if(verts.length>0){
    ctx.strokeStyle='#3FAE8C'; ctx.lineWidth=2;
    ctx.beginPath();
    verts.forEach((v,i)=>{ const [x,y]=toPx(v); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.stroke();
    if(verts.length>=3){
      const [x0,y0]=toPx(verts[0]), [xl,yl]=toPx(verts[verts.length-1]);
      ctx.setLineDash([6,4]); ctx.strokeStyle='rgba(63,174,140,0.5)';
      ctx.beginPath(); ctx.moveTo(xl,yl); ctx.lineTo(x0,y0); ctx.stroke();
      ctx.setLineDash([]);
    }
    verts.forEach((v,i)=>{
      const [x,y]=toPx(v);
      ctx.beginPath(); ctx.arc(x,y, i===0?7:5, 0, Math.PI*2);
      ctx.fillStyle = i===0 ? '#D9A441' : '#3FAE8C';
      ctx.fill();
    });
  }
}

function bboxFor2DShape(){
  if(state.shape==='rectangle') return {w:state.geom.width, h:state.geom.height};
  const verts = state.polygon.vertices;
  if(verts.length===0) return {w:1,h:1};
  let maxX=0, maxY=0;
  verts.forEach(v=>{ if(v.x>maxX) maxX=v.x; if(v.y>maxY) maxY=v.y; });
  return {w:maxX||1, h:maxY||1};
}

function drawPreviewShape(cv, highlight){
  const ctx = cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  const bbox = bboxFor2DShape();
  ctx.strokeStyle='#3FAE8C'; ctx.lineWidth=2; ctx.fillStyle='rgba(63,174,140,0.06)';

  if(state.shape==='rectangle'){
    const tf = fitTransform(bbox, cv.width, cv.height, 30);
    const pts = [[0,0],[bbox.w,0],[bbox.w,bbox.h],[0,bbox.h]];
    ctx.beginPath();
    pts.forEach((p,i)=>{ const [x,y]=tf(p[0],p[1]); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.closePath(); ctx.fill(); ctx.stroke();
    if(highlight){
      const edges = { bottom:[[0,0],[bbox.w,0]], right:[[bbox.w,0],[bbox.w,bbox.h]], top:[[bbox.w,bbox.h],[0,bbox.h]], left:[[0,bbox.h],[0,0]] };
      const seg = edges[highlight];
      if(seg){
        ctx.strokeStyle='#D9A441'; ctx.lineWidth=5;
        ctx.beginPath();
        seg.forEach((p,i)=>{ const [x,y]=tf(p[0],p[1]); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
        ctx.stroke();
      }
    }
    return;
  }

  // custom polygon
  const verts = state.polygon.vertices;
  if(verts.length<3) return;
  const tf = fitTransform(bbox, cv.width, cv.height, 30);
  ctx.beginPath();
  verts.forEach((p,i)=>{ const [x,y]=tf(p.x,p.y); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.closePath(); ctx.fill(); ctx.stroke();
  if(highlight){
    const idx = parseInt(String(highlight).replace('edge',''), 10);
    if(!isNaN(idx)){
      const a=verts[idx], b=verts[(idx+1)%verts.length];
      const [ax,ay]=tf(a.x,a.y), [bx,by]=tf(b.x,b.y);
      ctx.strokeStyle='#D9A441'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    }
  }
}

function numField(labelText, value, unit, onChange){
  const f = document.createElement('div'); f.className='field';
  const l = document.createElement('label'); l.textContent = labelText;
  const i = document.createElement('input'); i.type='number'; i.step='any'; i.value=value; i.min='0.0001';
  i.addEventListener('input', ()=>{
    const v = parseFloat(i.value);
    if(!isNaN(v) && v>0){ onChange(v); refreshPreviewIfPresent(); }
  });
  const u = document.createElement('span'); u.className='unit'; u.textContent=unit;
  f.appendChild(l); f.appendChild(i); f.appendChild(u);
  return f;
}

function refreshPreviewIfPresent(){
  const cv = document.querySelector('#mainPanel .canvas-wrap canvas');
  if(cv && STEPS[state.step].key==='geometry'){
    if(state.dimension==='1d') draw1DDomain(cv, state.geom.length);
    else drawPreviewShape(cv);
  }
  renderInfo();
}

/* --- Step 3: Material --- */
function renderMaterialStep(main){
  makeTitle(main, 'คุณสมบัติของวัสดุ', 'กำหนดค่าที่จำเป็นสำหรับสมการการนำความร้อน (หนา 1 หน่วยตั้งฉากกับระนาบ 2D)');

  const row = document.createElement('div'); row.className='field-row';
  row.appendChild(numField('สัมประสิทธิ์การนำความร้อน k', state.material.k, 'W/(m·K)', v=>{state.material.k=v;}));
  if(state.analysisType==='transient'){
    row.appendChild(numField('ความหนาแน่น ρ', state.material.rho, 'kg/m³', v=>{state.material.rho=v;}));
    row.appendChild(numField('ความจุความร้อนจำเพาะ cp', state.material.cp, 'J/(kg·K)', v=>{state.material.cp=v;}));
  }
  main.appendChild(row);

  const row2 = document.createElement('div'); row2.className='field-row';
  const f2 = document.createElement('div'); f2.className='field';
  f2.innerHTML = `<label>แหล่งกำเนิดความร้อนภายใน Q (ไม่บังคับ)</label>`;
  const i2 = document.createElement('input'); i2.type='number'; i2.step='any'; i2.value=state.material.Q;
  i2.addEventListener('input', ()=>{ const v=parseFloat(i2.value); state.material.Q = isNaN(v)?0:v; });
  const u2 = document.createElement('span'); u2.className='unit'; u2.textContent='W/m³';
  f2.appendChild(i2); f2.appendChild(u2);
  row2.appendChild(f2);
  main.appendChild(row2);

  const setBtn = document.createElement('button'); setBtn.className='secondary'; setBtn.textContent='Set';
  setBtn.style.marginBottom='6px';
  const applied = document.createElement('div'); applied.className='eq-applied'; applied.style.display='block'; applied.style.marginBottom='16px';
  function refreshApplied(){
    let txt = `ยืนยันแล้ว: k = ${state.material.k} W/(m·K), Q = ${state.material.Q} W/m³`;
    if(state.analysisType==='transient'){
      txt += `, ρ = ${state.material.rho} kg/m³, cp = ${state.material.cp} J/(kg·K)`;
    }
    applied.textContent = txt;
  }
  setBtn.onclick = refreshApplied;
  refreshApplied();
  main.appendChild(setBtn);
  main.appendChild(applied);

  eqBlock(main, "Fourier's law (ความสัมพันธ์ของฟลักซ์ความร้อนกับ k)",
    `${vec('q')} ${rm('=')} ${rm('-')}k∇T`,
    `<b>q</b> (ตัวหนา) คือเวกเตอร์ฟลักซ์ความร้อน (W/m²) เครื่องหมายลบแสดงว่าความร้อนไหลจากบริเวณอุณหภูมิสูงไปยังบริเวณอุณหภูมิต่ำ ค่า <b>k</b> ที่กำหนดด้านบนจะถูกใช้ในสมการนี้และในสมการการนำความร้อนหลัก (governing equation) ที่แสดงไว้ในขั้นตอนก่อนหน้า`
  );

  if(state.analysisType==='transient'){
    const noteT = document.createElement('div'); noteT.className='eq-note';
    noteT.textContent = `ρc (ความจุความร้อนต่อปริมาตร) = ρ × cp = ${(state.material.rho*state.material.cp).toLocaleString()} J/(m³·K) — ใช้ในสมการ transient governing equation ที่แสดงไว้ในขั้นตอนก่อนหน้า ส่วนอุณหภูมิเริ่มต้นและระยะเวลาการจำลองกำหนดในขั้นตอนถัดไป`;
    main.appendChild(noteT);
  }

  navButtons(main, { back:true, next:true, onNext:()=>{ state.step=3; renderAll(); } });
}

/* ---- Illustrative shape-function diagram for the Mesh step (1D-style, order-aware) ---- */
function drawShapeFunctionDiagram(canvas, order){
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);

  const padL=48, padR=16;
  const plotW = W - padL - padR;
  const panelH = 88;
  const panelATop = 34;
  const panelBTop = panelATop + panelH + 66;
  const colors = ['#3FAE8C', '#D9A441', '#227A5E'];
  const isQuad = order==='quadratic';
  const nodesX = isQuad ? [0, 0.5, 1] : [0, 1];

  function xToPx(x){ return padL + x*plotW; }
  function labelAlign(x){ return x<=0.02 ? 'left' : (x>=0.98 ? 'right' : 'center'); }
  function N(i, x){
    if(!isQuad) return i===0 ? (1-x) : x;
    if(i===0) return 2*(x-0.5)*(x-1);
    if(i===1) return 4*x*(1-x);
    return 2*x*(x-0.5);
  }

  // ---- Panel A: the shape functions themselves ----
  const vMinA=-0.2, vMaxA=1.3;
  function yToPxA(v){ return panelATop + panelH*(vMaxA-v)/(vMaxA-vMinA); }
  ctx.fillStyle='#3A4145'; ctx.font='bold 12px sans-serif'; ctx.textAlign='left';
  ctx.fillText('1) รูปร่างของ Shape function Nᵢ(x)', padL, panelATop-16);

  ctx.strokeStyle='#D3DAD9'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(padL, yToPxA(0)); ctx.lineTo(padL+plotW, yToPxA(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL, yToPxA(1)); ctx.lineTo(padL+plotW, yToPxA(1)); ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);

  for(let i=0;i<nodesX.length;i++){
    ctx.strokeStyle = colors[i]; ctx.lineWidth = 2.2;
    ctx.beginPath();
    for(let s=0;s<=60;s++){
      const x = s/60, v = N(i,x);
      const px=xToPx(x), py=yToPxA(v);
      if(s===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  nodesX.forEach((nx,i)=>{
    ctx.fillStyle = colors[i]; ctx.font='bold 12px sans-serif'; ctx.textAlign=labelAlign(nx);
    ctx.fillText('N'+(i+1), xToPx(nx), yToPxA(1)-10);
    ctx.strokeStyle='#7C8588'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(xToPx(nx), yToPxA(0)-4); ctx.lineTo(xToPx(nx), yToPxA(0)+4); ctx.stroke();
  });
  ctx.fillStyle='#7C8588'; ctx.font='10px sans-serif'; ctx.textAlign='right';
  ctx.fillText('(= 1 ที่โหนดของตัวเอง, = 0 ที่โหนดอื่น)', padL+plotW, panelATop-16);

  // ---- Panel B: using them to interpolate real example nodal values ----
  const exampleT = isQuad ? [20,90,50] : [20,80];
  function interp(x){
    let v=0; for(let i=0;i<nodesX.length;i++) v += exampleT[i]*N(i,x);
    return v;
  }
  const sampledVals=[]; for(let s=0;s<=60;s++) sampledVals.push(interp(s/60));
  const vMinB = Math.min(...sampledVals, ...exampleT)-10, vMaxB = Math.max(...sampledVals, ...exampleT)+16;
  function yToPxB(v){ return panelBTop + panelH*(vMaxB-v)/(vMaxB-vMinB); }

  ctx.fillStyle='#3A4145'; ctx.font='bold 12px sans-serif'; ctx.textAlign='left';
  ctx.fillText('2) ใช้ประมาณค่า T(x) จากค่าโหนดตัวอย่าง', padL, panelBTop-16);

  ctx.strokeStyle='#3A4145'; ctx.lineWidth=2.6;
  ctx.beginPath();
  for(let s=0;s<=60;s++){
    const x=s/60, v=interp(x);
    const px=xToPx(x), py=yToPxB(v);
    if(s===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.stroke();

  nodesX.forEach((nx,i)=>{
    const px=xToPx(nx), py=yToPxB(exampleT[i]);
    ctx.beginPath(); ctx.arc(px,py,5,0,Math.PI*2); ctx.fillStyle=colors[i]; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='#3A4145'; ctx.font='bold 11.5px sans-serif'; ctx.textAlign=labelAlign(nx);
    const dy = (isQuad && i===1) ? 16 : -12; // keep the middle node's label from colliding with the curve's peak
    ctx.fillText('T'+(i+1)+' = '+exampleT[i], px, py + dy);
  });

  ctx.fillStyle='#7C8588'; ctx.font='10.5px sans-serif'; ctx.textAlign='center';
  ctx.fillText('ตำแหน่งภายในเอลิเมนต์', padL+plotW/2, panelBTop+panelH+18);
}
